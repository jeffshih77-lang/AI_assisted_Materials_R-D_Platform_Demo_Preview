name: Runtime10 Exact Official Verification
on:
  push:
    branches: [market-downloader-ci-v015]
    paths:
      - 'market_downloader_ci/runtime10_exact_verify.py'
      - '.github/workflows/runtime10-exact-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-fetch exact official sources and compare runtime10
        env:
          PYTHONUTF8: '1'
        run: python market_downloader_ci/runtime10_exact_verify.py
