name: P4-A diagnose MOPS 307
on:
  push:
    paths:
      - '.github/workflows/p4a_diag_307.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe redirect chain
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          UA='Mozilla/5.0 (compatible; P4AMaterialInfoFormalRaw/4.0)'
          BASE='https://mopsov.twse.com.tw/mops/web/ajax_t51sb10'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          def url(page):
              p=[('encodeURIComponent','1'),('firstin','true'),('id',''),('key',''),('TYPEK',''),('Stp','4'),('go','false'),('COMPANY_ID',''),('r1','1'),('KIND','L'),('CODE',''),('keyWord',''),('year','90'),('month1','0'),('begin_day','1'),('end_day','31'),('PCount','100'),('pagenum',str(page))]
              return BASE+'?'+urllib.parse.urlencode(p)
          out=[]
          for page in (12,13,216,217):
              cur=url(page); chain=[]
              for hop in range(6):
                  req=urllib.request.Request(cur,headers={'User-Agent':UA,'Accept':'*/*','Connection':'close'},method='GET')
                  try:
                      with opener.open(req,timeout=60) as r:
                          b=r.read(512); chain.append({'hop':hop,'url':cur,'status':getattr(r,'status',None),'final_url':r.geturl(),'location':r.headers.get('Location'),'content_type':r.headers.get('Content-Type'),'sample_hex':b[:64].hex(),'sample_text':b[:200].decode('utf-8','replace')}); break
                  except urllib.error.HTTPError as e:
                      loc=e.headers.get('Location'); chain.append({'hop':hop,'url':cur,'status':e.code,'location':loc,'content_type':e.headers.get('Content-Type')})
                      if e.code not in (301,302,303,307,308) or not loc: break
                      cur=urllib.parse.urljoin(cur,loc)
                  except Exception as e:
                      chain.append({'hop':hop,'url':cur,'error':repr(e)}); break
              out.append({'page':page,'chain':chain})
          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('P4A_307_DIAG.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-307-diagnostic
          path: P4A_307_DIAG.json
          retention-days: 2
