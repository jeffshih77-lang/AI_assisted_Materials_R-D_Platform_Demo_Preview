name: TWSE RAW W01 History Free V3
on:
  push:
    branches: [twse-raw-free-20260910]
    paths:
      - 'twse_raw_free/collector_v3.py'
      - '.github/workflows/twse_raw_history_free_v3.yml'
permissions:
  contents: read
concurrency:
  group: twse-raw-w01-history-free-v3
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - name: Download validate and package official TWSE RAW
        run: python twse_raw_free/collector_v3.py --year "${{ matrix.year }}" --out "out_${{ matrix.year }}"
      - name: Upload yearly RAW package
        uses: actions/upload-artifact@v4
        with:
          name: TWSE_DAILY_K_${{ matrix.year }}_OFFICIAL_RAW_V3
          path: |
            out_${{ matrix.year }}/TWSE_DAILY_K_*_OFFICIAL_RAW_V3.zip
            out_${{ matrix.year }}/manifest/*.json
          compression-level: 9
          retention-days: 1
          if-no-files-found: error
