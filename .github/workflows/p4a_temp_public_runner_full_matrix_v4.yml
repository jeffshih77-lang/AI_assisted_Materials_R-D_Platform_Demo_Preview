          - { roc: 113, kind: 'L', start: 0, end: 424 }
          - { roc: 113, kind: 'O', start: 0, end: 266 }
          - { roc: 114, kind: 'L', start: 0, end: 458 }
          - { roc: 114, kind: 'O', start: 0, end: 286 }
          - { roc: 115, kind: 'L', start: 16, end: 370 }
          - { roc: 115, kind: 'O', start: 0, end: 232 }
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ROC_YEAR: ${{ matrix.roc }}
      KIND: ${{ matrix.kind }}
      START_PAGE: ${{ matrix.start }}
      END_PAGE: ${{ matrix.end }}
      DETAIL_WORKERS: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture formal RAW
        run: python p4a_runner/p4a_material_info_page_chunk_v4.py
      - name: Package artifact
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root=next(pathlib.Path('out_p4a_chunk').iterdir())
          out=pathlib.Path(root.name+'.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-material-info-ROC${{ matrix.roc }}-${{ matrix.kind }}-P${{ matrix.start }}-${{ matrix.end }}-v4
          path: P4A-MATERIAL-ROC${{ matrix.roc }}-${{ matrix.kind }}-P*.zip
          if-no-files-found: error
          retention-days: 2
