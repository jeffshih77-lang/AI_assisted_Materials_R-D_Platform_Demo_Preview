name: W08 PRE residual repair v1
on:
  push:
    branches: [w08-final-free-source-20260912]
    paths: ['.github/workflows/w08_pre_residual_repair_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w08-final-free-source-20260912
          fetch-depth: 0
      - name: Reconcile 12576 successes and repair all 234 residual units without early-stop
        run: python3 w08_public_runner/w08_pre_residual_repair_v1.py
      - name: Upload residual success RAW and exact failure ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W08_PRE_RESIDUAL_REPAIR_V1_20260912
          path: out_pre_residual_repair/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
