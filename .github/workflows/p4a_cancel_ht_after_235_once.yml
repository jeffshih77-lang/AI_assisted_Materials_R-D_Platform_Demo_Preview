name: P4-A cancel HT after 235 artifacts once
on:
  push:
    paths:
      - '.github/workflows/p4a_cancel_ht_after_235_once.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Freeze predecessor and cancel only active HT run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '34685616731'
        run: |
          set -euo pipefail
          total=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=1" --jq '.total_count')
          echo "artifact_count_before_cancel=$total"
          test "$total" -ge 235
          state=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
          echo "status_before_cancel=$state"
          if [ "$state" != completed ]; then
            gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          fi
          for i in $(seq 1 120); do
            state=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status')
            echo "status=$state"
            [ "$state" = completed ] && exit 0
            sleep 5
          done
          exit 1
