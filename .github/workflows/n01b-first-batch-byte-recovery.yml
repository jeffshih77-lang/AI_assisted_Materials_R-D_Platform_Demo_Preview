name: N01-B-A First Batch Official Byte Recovery

on:
  push:
    branches: [n01b-first-batch-byte-recovery-20260916]
    paths: [.github/workflows/n01b-first-batch-byte-recovery.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture exact official TPEx bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, hashlib, json, pathlib, ssl, time, urllib.parse, urllib.request, zipfile
          dates=[('2026-08-14',1367),('2026-08-17',1367),('2026-08-18',1367),('2026-08-24',1362),('2026-08-25',1365),('2026-08-27',1370),('2026-08-31',1366),('2026-09-01',1363),('2026-09-02',1355),('2026-09-03',1359)]
          root=pathlib.Path('n01b_first_batch_official_raw'); raw=root/'raw'; receipts=root/'receipts'; raw.mkdir(parents=True,exist_ok=True); receipts.mkdir(parents=True,exist_ok=True)
          ctx=ssl.create_default_context(); records=[]
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36 N01B-A/1.0','Accept':'text/csv,text/plain,*/*;q=0.8','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.8','Accept-Encoding':'identity','Connection':'close','Cache-Control':'no-cache'}
          def fetch(url):
            attempts=[]
            for n in range(1,4):
              a={'attempt':n,'started_at':dt.datetime.now(dt.timezone.utc).isoformat()}
              try:
                req=urllib.request.Request(url,headers=headers,method='GET')
                with urllib.request.urlopen(req,timeout=45,context=ctx) as r: body=r.read(); status=getattr(r,'status',200); final=r.geturl(); rh=dict(r.headers.items())
                a.update({'status':status,'final_url':final,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'retrieved_at':dt.datetime.now(dt.timezone.utc).isoformat()}); attempts.append(a); return status,final,rh,body,attempts
              except Exception as e:
                a.update({'error_type':type(e).__name__,'error':repr(e),'retrieved_at':dt.datetime.now(dt.timezone.utc).isoformat()}); attempts.append(a)
                if n<3: time.sleep(2*n)
            return None,None,{},b'',attempts
          for day,expected_rows in dates:
            dslash=day.replace('-','/'); roc=f'{int(day[:4])-1911}/{day[5:7]}/{day[8:10]}'
            endpoints={'dailyQuotes':('TPEX_AFTERTRADING_DAILYQUOTES_CSV','https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?'+urllib.parse.urlencode({'date':dslash,'id':'','response':'csv'})),'otc_control':('TPEX_AFTERTRADING_OTC_CSV','https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?'+urllib.parse.urlencode({'date':dslash,'type':'AL','id':'','response':'csv','order':'0','sort':'asc'}))}
            for label,(family,url) in endpoints.items():
              status,final,rh,body,attempts=fetch(url); sub=raw/label; sub.mkdir(exist_ok=True); rp=sub/f'{day.replace("-","")}.csv'; rp.write_bytes(body)
              line_count=len(body.splitlines()); comma_lines=sum(1 for x in body.splitlines()[:2000] if x.count(b',')>=5); date_marker=False; decoders=[]
              for enc in ('cp950','utf-8-sig','utf-8'):
                try: txt=body.decode(enc,'strict'); decoders.append({'encoding':enc,'strict_success':True,'exact_roundtrip':txt.encode(enc)==body}); date_marker=date_marker or (roc in txt) or (day in txt)
                except Exception as e: decoders.append({'encoding':enc,'strict_success':False,'error_type':type(e).__name__})
              valid=bool(status==200 and body and final and urllib.parse.urlparse(final).hostname in {'www.tpex.org.tw','tpex.org.tw'} and b'<html' not in body[:1000].lower() and line_count>20 and comma_lines>10)
              rec={'schema':'n01b_first_batch_official_capture_v1','market_date':day,'expected_reference_rows':expected_rows,'label':label,'source_family':family,'request_method':'GET','request_url':url,'request_headers':headers,'http_status':status,'final_url':final,'response_headers':rh,'raw_file':rp.as_posix(),'raw_bytes':len(body),'raw_sha256':hashlib.sha256(body).hexdigest(),'literal_efbfbd_count':body.count(b'\xef\xbf\xbd'),'line_count':line_count,'comma_lines':comma_lines,'requested_date_marker_seen':date_marker,'decoder_diagnostics':decoders,'attempts':attempts,'transport_capture_valid':valid,'admission':'NOT_PERFORMED'}
              records.append(rec); (receipts/f'{day.replace("-","")}_{label}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps({k:rec[k] for k in ('market_date','label','http_status','raw_bytes','raw_sha256','line_count','comma_lines','requested_date_marker_seen','transport_capture_valid')},ensure_ascii=False),flush=True); time.sleep(.15)
          primary=[r for r in records if r['label']=='dailyQuotes']
          manifest={'schema':'n01b_first_batch_official_raw_package_v1','work_id':'N01-B-A','dataset_id':'TPEX_DAILY_K','publisher':'Taipei Exchange (TPEx)','capture_transport':'github_actions_ubuntu_https_exact_bytes','created_at':dt.datetime.now(dt.timezone.utc).isoformat(),'target_dates':[d for d,_ in dates],'expected_dates':len(dates),'records':records,'primary_capture_count':len(primary),'primary_transport_valid_count':sum(r['transport_capture_valid'] for r in primary),'all_primary_transport_valid':all(r['transport_capture_valid'] for r in primary),'admission':'NOT_PERFORMED'}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=[]
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='SHA256SUMS.txt': lines.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}')
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='ascii')
          pkg=pathlib.Path('N01B_FIRST_BATCH_OFFICIAL_RAW_20260916.zip')
          with zipfile.ZipFile(pkg,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=p.relative_to(root).as_posix())
          psha=hashlib.sha256(pkg.read_bytes()).hexdigest(); pathlib.Path(str(pkg)+'.sha256').write_text(f'{psha}  {pkg.name}\n',encoding='ascii'); summary={'package':pkg.name,'package_sha256':psha,'package_bytes':pkg.stat().st_size,'primary_valid':sum(r['transport_capture_valid'] for r in primary),'primary_expected':10,'all_primary_transport_valid':all(r['transport_capture_valid'] for r in primary)}; pathlib.Path('N01B_FIRST_BATCH_OFFICIAL_RAW_20260916_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(summary,ensure_ascii=False,indent=2),flush=True)
          if not all(r['transport_capture_valid'] for r in primary): raise SystemExit(2)
          PY
      - name: Upload official byte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n01b-first-batch-official-raw-20260916
          path: |
            N01B_FIRST_BATCH_OFFICIAL_RAW_20260916.zip
            N01B_FIRST_BATCH_OFFICIAL_RAW_20260916.zip.sha256
            N01B_FIRST_BATCH_OFFICIAL_RAW_20260916_SUMMARY.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
