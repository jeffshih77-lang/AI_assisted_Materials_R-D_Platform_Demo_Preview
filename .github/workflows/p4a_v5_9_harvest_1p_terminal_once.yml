name: P4-A V5.9 harvest terminal 1p residual once
on:
  push:
    paths:
      - '.github/workflows/p4a_v5_9_harvest_1p_terminal_once.yml'
permissions:
  actions: read
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact_count: ${{ steps.plan.outputs.artifact_count }}
      page_count: ${{ steps.plan.outputs.page_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '34699268851'
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" --paginate --slurp > arts.json
          python - <<'PY'
          import json,re,os
          live=json.load(open('p4a_runner/P4A_FORMAL_MISSING_LIVE.json'))
          missing=set()
          for r in live['exact_missing_ranges']:
            y,k,s,e=int(r['roc']),r['kind'],int(r['start']),int(r['end'])
            missing.update((y,k,p) for p in range(s,e+1))
          objs=json.load(open('arts.json')); arts=[]
          for o in objs: arts += o.get('artifacts',[])
          rx=re.compile(r'^p4a-v5r1-gap-ROC(\d+)-([LO])-P(\d+)$')
          chosen={}
          for a in arts:
            if a.get('expired'): continue
            m=rx.match(a.get('name',''))
            if not m: continue
            key=(int(m.group(1)),m.group(2),int(m.group(3)))
            if key not in missing: continue
            if not a.get('digest','').startswith('sha256:'): raise SystemExit(f'no digest {a["id"]}')
            old=chosen.get(key)
            if old is None or int(a['id'])>int(old['id']): chosen[key]=a
          rows=sorted((int(a['id']),int(a['size_in_bytes']),key) for key,a in chosen.items())
          limit=70_000_000; batches=[]; cur=[]; size=0
          for aid,n,key in rows:
            if cur and size+n>limit:
              batches.append(cur); cur=[]; size=0
            cur.append(aid); size+=n
          if cur: batches.append(cur)
          inc=[{'batch':f'{i+1:03d}','ids':','.join(map(str,b))} for i,b in enumerate(batches)]
          matrix=json.dumps({'include':inc},separators=(',',':'))
          print({'source_run':os.environ['SOURCE_RUN'],'current_formal_missing':len(missing),'selected_unique_artifacts':len(rows),'selected_pages':len(rows),'batches':len(batches)})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+matrix+'\n')
            f.write('artifact_count='+str(len(rows))+'\n')
            f.write('page_count='+str(len(rows))+'\n')
          PY
  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.artifact_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BATCH: ${{ matrix.batch }}
      IDS_CSV: ${{ matrix.ids }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '34699268851'
    steps:
      - name: Download immutable successful one-page artifacts only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming stage
          IFS=',' read -ra IDS <<< "$IDS_CSV"
          for id in "${IDS[@]}"; do
            gh api "repos/$REPO/actions/artifacts/$id" > "incoming/$id.meta.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "incoming/$id.outer.zip"
          done
      - name: Validate outer digest and every V4 RAW package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,re,zipfile,io,hashlib,pathlib
          inc=pathlib.Path('incoming'); stage=pathlib.Path('stage')
          rx=re.compile(r'^p4a-v5r1-gap-ROC(\d+)-([LO])-P(\d+)$')
          ids=[int(x) for x in os.environ['IDS_CSV'].split(',') if x]; index=[]
          for aid in ids:
            meta=json.load(open(inc/f'{aid}.meta.json')); outer=(inc/f'{aid}.outer.zip').read_bytes()
            got=hashlib.sha256(outer).hexdigest(); exp=meta['digest'].split(':',1)[1]
            if got!=exp: raise SystemExit(f'outer digest mismatch {aid}: {got} != {exp}')
            name=meta['name']; m=rx.match(name)
            if not m: raise SystemExit(f'unrecognized artifact {aid} {name}')
            y,k,p=int(m.group(1)),m.group(2),int(m.group(3))
            with zipfile.ZipFile(io.BytesIO(outer)) as oz:
              children=[n for n in oz.namelist() if n.lower().endswith('.zip') and not n.endswith('/')]
              if len(children)!=1: raise SystemExit(f'artifact {aid} expected 1 inner zip, got {children}')
              child_name=children[0]; child=oz.read(child_name)
            csha=hashlib.sha256(child).hexdigest(); csize=len(child)
            with zipfile.ZipFile(io.BytesIO(child)) as cz:
              mans=[n for n in cz.namelist() if n.endswith('/MANIFEST.json') or n=='MANIFEST.json']
              if len(mans)!=1: raise SystemExit(f'{aid} manifest count {len(mans)}')
              man=json.loads(cz.read(mans[0]).decode('utf-8-sig'))
            if man.get('schema')!='p4a_material_info_page_chunk_v4': raise SystemExit(f'{aid} schema {man.get("schema")}')
            cov=man.get('coverage',{}); ass=man.get('assertions',{}); caps=man.get('captures',[]); anos=man.get('anomalies',[])
            if (int(cov.get('roc_year',-1)),cov.get('kind'),int(cov.get('start_page',-1)),int(cov.get('end_page',-1)))!=(y,k,p,p): raise SystemExit(f'{aid} coverage mismatch')
            listcaps=[x for x in caps if x.get('stage')=='LIST']; details=[x for x in caps if x.get('stage')=='DETAIL']
            if int(ass.get('page_count',-1))!=1 or int(ass.get('list_capture_count',-1))!=1 or len(listcaps)!=1: raise SystemExit(f'{aid} list/page assertion mismatch')
            if int(ass.get('detail_capture_count',-1))!=len(details): raise SystemExit(f'{aid} detail count mismatch')
            if ass.get('all_http_200') is not True or ass.get('all_payload_nonempty') is not True: raise SystemExit(f'{aid} manifest assertions fail')
            if any(x.get('http_status')!=200 or int(x.get('payload_bytes',0))<=0 for x in caps): raise SystemExit(f'{aid} capture assertion fail')
            if int(ass.get('nonstandard_detail_count',-1))!=len(anos): raise SystemExit(f'{aid} anomaly count mismatch')
            if any(a.get('disposition')!='PRESERVE_RAW_DO_NOT_ZERO_FILL' for a in anos): raise SystemExit(f'{aid} anomaly disposition fail')
            pages=sorted(int(x.get('page')) for x in man.get('page_summaries',[]))
            if pages!=[p]: raise SystemExit(f'{aid} page summaries not exact one-page range')
            stored=f'artifact_{aid}__{pathlib.Path(child_name).name}'; (stage/stored).write_bytes(child)
            index.append({'artifact_id':aid,'artifact_name':name,'artifact_outer_digest':meta['digest'],'artifact_outer_size':meta['size_in_bytes'],'child_original_name':child_name,'child_stored_name':stored,'child_sha256':csha,'child_size':csize,'coverage':{'roc_year':y,'kind':k,'start_page':p,'end_page':p,'page_count':1},'assertions':{'list_capture_count':len(listcaps),'detail_capture_count':len(details),'nonstandard_detail_count':len(anos),'all_http_200':True,'all_payload_nonempty':True}})
          out={'schema':'p4a_v5_terminal_1p_harvest_bundle_index_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_requests_made':False,'source_run':int(os.environ['SOURCE_RUN']),'batch':os.environ['BATCH'],'artifact_count':len(index),'page_count':len(index),'entries':index}
          (stage/'BUNDLE_INDEX.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'batch':os.environ['BATCH'],'artifacts':len(index),'pages':len(index)},indent=2))
          PY
      - name: Build and self-verify Drive-sized parent bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,zipfile,pathlib,hashlib
          st=pathlib.Path('stage'); idx=json.loads((st/'BUNDLE_INDEX.json').read_text())
          out=pathlib.Path(f'P4A-V5-TERMINAL-1P-HARVEST-BATCH{os.environ["BATCH"]}-RUN{os.environ["SOURCE_RUN"]}.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
            z.write(st/'BUNDLE_INDEX.json','BUNDLE_INDEX.json')
            for e in idx['entries']: z.write(st/e['child_stored_name'],e['child_stored_name'])
          if out.stat().st_size>=95*1024*1024: raise SystemExit(f'parent too large for Drive connector: {out.stat().st_size}')
          with zipfile.ZipFile(out) as z:
            check=json.loads(z.read('BUNDLE_INDEX.json'))
            for e in check['entries']:
              b=z.read(e['child_stored_name']); assert len(b)==e['child_size'] and hashlib.sha256(b).hexdigest()==e['child_sha256']
          print(out, out.stat().st_size, hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-terminal-1p-harvest-batch${{ matrix.batch }}-source${{ env.SOURCE_RUN }}
          path: P4A-V5-TERMINAL-1P-HARVEST-BATCH${{ matrix.batch }}-RUN${{ env.SOURCE_RUN }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
