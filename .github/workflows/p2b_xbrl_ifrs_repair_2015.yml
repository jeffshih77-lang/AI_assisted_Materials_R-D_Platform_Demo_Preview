name: P2B repair IFRS 2015 capture

on:
  push:
    branches: [p2b-financial-transport-20260912]
    paths: [.github/workflows/p2b_xbrl_ifrs_repair_2015.yml]

permissions:
  contents: read

jobs:
  repair_2015:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Capture 2015 with ZIP-integrity retries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, io, json, html, time, zipfile, hashlib, pathlib, datetime, urllib.request
          year=2015
          base=pathlib.Path('p2b_ifrs_2015'); raw=base/'raw'; meta=base/'meta'
          raw.mkdir(parents=True,exist_ok=True); meta.mkdir(parents=True,exist_ok=True)
          page_url='https://mopsov.twse.com.tw/mops/web/t203sb02'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def request_bytes(url, referer=None, timeout=300):
              h={'User-Agent':ua,'Accept':'application/zip,application/octet-stream,text/html,*/*','Accept-Encoding':'identity','Connection':'close'}
              if referer: h['Referer']=referer
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=timeout) as r:
                  return r.status,r.read(),dict(r.headers.items()),r.geturl()
          st,pb,ph,pfinal=request_bytes(page_url)
          (meta/'t203sb02.response.bin').write_bytes(pb)
          text=pb.decode('utf-8-sig')
          (meta/'t203sb02.decoded.html').write_text(text,encoding='utf-8')
          pat=re.compile(r"window\.open\('([^']*fileName=tifrs-(\d{4})Q([1-4])\.zip[^']*)'",re.I)
          links={(int(y),int(q)):html.unescape(href) for href,y,q in pat.findall(text)}
          rows=[]
          for q in [1,2,3,4]:
              href=links[(year,q)]
              url=urllib.request.urljoin('https://mopsov.twse.com.tw',href)
              last=None
              for attempt in range(1,7):
                  try:
                      st,b,h,final=request_bytes(url,page_url)
                      if st!=200 or b[:4]!=b'PK\x03\x04':
                          raise RuntimeError(f'not zip status={st} bytes={len(b)} head={b[:80]!r}')
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          bad=z.testzip(); names=z.namelist()
                      if bad is not None or not names:
                          raise RuntimeError(f'zip bad={bad} members={len(names)}')
                      break
                  except Exception as e:
                      last=repr(e)
                      print(json.dumps({'year':year,'quarter':q,'attempt':attempt,'retry_error':last},ensure_ascii=False))
                      if attempt==6: raise
                      time.sleep(3*attempt)
              name=f'tifrs-{year}Q{q}.zip'; (raw/name).write_bytes(b)
              issuer_ids=sorted(set(m.group(1) for n in names for m in [re.search(r'-(\d{4,6})-\d{4}Q[1-4]\.(?:xml|html)$',n,re.I)] if m))
              row={'work_unit_source_period':f'{year}Q{q}','source_family':'MOPSOV_XBRL_IFRS_QUARTERLY_BATCH_ARCHIVE','official_page':page_url,'source_href_exact':href,'source_url_exact':url,'final_url':final,'http_status':st,'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'filename':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'zip_members':len(names),'zip_test_bad_member':bad,'issuer_ids_detected':len(issuer_ids),'issuer_id_sample':issuer_ids[:30],'first_members':names[:30],'integrity_attempts':attempt}
              rows.append(row); print(json.dumps(row,ensure_ascii=False))
          page_meta={'source_page':page_url,'status':st,'bytes':len(pb),'sha256':hashlib.sha256(pb).hexdigest(),'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'selected_year':year,'selected_quarters':[1,2,3,4]}
          (meta/'source_page.json').write_text(json.dumps(page_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          manifest={'lane':'P2-B','dataset':'FINANCIAL_STATEMENTS_EPS','schema_family':'IFRS_POST_ADOPTION_XBRL','raw_immutable':True,'year':year,'quarter_count':4,'quarters':rows,'source_page_evidence':page_meta,'repair_reason':'Initial 2015 job encountered a transient truncated ZIP; this repair retries until ZIP integrity passes.'}
          (base/'YEAR_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (base/'QUARTER_MANIFEST.ndjson').write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')
          PY
      - name: Upload repaired 2015 package
        uses: actions/upload-artifact@v4
        with:
          name: P2B_XBRL_IFRS_RAW_2015_REPAIR_20260912
          path: p2b_ifrs_2015/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
