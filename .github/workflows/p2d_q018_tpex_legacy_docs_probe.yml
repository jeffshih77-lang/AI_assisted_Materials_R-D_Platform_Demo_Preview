name: P2-D Q0.18 bounded TPEx legacy docs probe

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'p2d-q015-byte-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public TPEx legacy-doc links and inspect bounded attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, re, json, hashlib, html, subprocess
          base='https://dsp.tpex.org.tw/web/system/mainboard.php'
          out=pathlib.Path('out')
          result={'page':base,'links':[],'downloads':[]}
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 P2D-Q018-LegacyDocs/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read(); result['page_status']=getattr(r,'status',200); result['page_bytes']=len(b); result['page_sha256']=hashlib.sha256(b).hexdigest(); result['page_content_type']=r.headers.get('Content-Type','')
          s=b.decode('big5',errors='replace')
          # Find anchors whose visible text or nearby text identifies only the two intended legacy documents.
          anchors=[]
          for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',s,re.I|re.S):
              href=html.unescape(m.group(1)); text=re.sub('<[^>]+>',' ',m.group(2)); text=re.sub(r'\s+',' ',html.unescape(text)).strip()
              pre=s[max(0,m.start()-300):m.end()+100]
              plain=re.sub('<[^>]+>',' ',pre); plain=re.sub(r'\s+',' ',html.unescape(plain))
              if ('新版收市後交易資訊格式說明' in plain and 'V1.20' in plain) or ('新版收市後交易資訊與原提供檔案對照說明' in plain):
                  full=urllib.parse.urljoin(base,href)
                  if full not in [x['url'] for x in anchors]: anchors.append({'url':full,'anchor_text':text,'context':plain[-450:]})
          result['links']=anchors[:4]
          for i,a in enumerate(result['links'][:2],1):
              rec={'url':a['url']}
              try:
                  req=urllib.request.Request(a['url'],headers={'User-Agent':'Mozilla/5.0 P2D-Q018-LegacyDocs/1.0','Referer':base})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      db=r.read(); rec.update({'status':getattr(r,'status',200),'final_url':r.geturl(),'bytes':len(db),'sha256':hashlib.sha256(db).hexdigest(),'content_type':r.headers.get('Content-Type',''),'content_disposition':r.headers.get('Content-Disposition',''),'magic_hex':db[:16].hex()})
                  p=out/f'doc_{i}.bin'; p.write_bytes(db)
                  # bounded text fingerprints only; no install/OCR
                  ascii_strings=subprocess.run(['strings','-a',str(p)],capture_output=True,text=True,errors='replace').stdout
                  utf16_strings=subprocess.run(['strings','-a','-el',str(p)],capture_output=True,text=True,errors='replace').stdout
                  text=(ascii_strings+'\n'+utf16_strings)
                  hits=[]
                  for key in ['S14','S39','券商進出個股明細','STK','BROKER','BRK','PRICE','成交單價','買進','賣出']:
                      if key.lower() in text.lower(): hits.append(key)
                  rec['string_hits']=hits
                  # save small grep context around ASCII S14/S39 if any
                  ctx=[]
                  lines=text.splitlines()
                  for j,line in enumerate(lines):
                      if 'S14' in line or 'S39' in line:
                          ctx.extend(lines[max(0,j-3):j+4])
                  rec['string_context']=ctx[:80]
              except Exception as e:
                  rec['error']=repr(e)
              result['downloads'].append(rec)
          (out/'q018_manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload one-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q018-tpex-legacy-docs
          path: out/
          if-no-files-found: error
          retention-days: 1
