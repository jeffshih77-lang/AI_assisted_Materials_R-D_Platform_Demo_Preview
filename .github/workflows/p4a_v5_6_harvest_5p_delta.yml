name: P4-A V5.6 harvest 5p delta
on:
  push:
    paths:
      - '.github/workflows/p4a_v5_6_harvest_5p_delta.yml'
permissions:
  actions: read
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN5: '34691917746'
      PRIOR_HARVEST_ARTIFACTS: '10298335358 10297435964'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest only new successful 5p artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/prior work/outer work/unpack drive_ready
          for A in $PRIOR_HARVEST_ARTIFACTS; do
            curl -fL --retry 5 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -o "work/prior/$A.zip" "https://api.github.com/repos/$REPO/actions/artifacts/$A/zip"
            mkdir -p "work/prior/$A"; unzip -q "work/prior/$A.zip" -d "work/prior/$A"
          done
          gh api "repos/$REPO/actions/runs/$RUN5/artifacts?per_page=100" --paginate --slurp > work/current.json
          python - <<'PY'
          import json,os,re,pathlib,hashlib,zipfile,subprocess
          seen=set(); expected=None
          for root in pathlib.Path('work/prior').iterdir():
            if not root.is_dir():continue
            for p in root.glob('*.zip'):
              with zipfile.ZipFile(p) as z:
                if 'BUNDLE_INDEX.json' in z.namelist():
                  idx=json.loads(z.read('BUNDLE_INDEX.json'));seen.update(int(e['artifact_id']) for e in idx['entries'])
            for s in root.glob('*SUMMARY*.json'):
              d=json.loads(s.read_text())
              if d.get('residual_after_snapshot_pages') is not None:
                expected={(int(r['roc']),r['kind'],x) for r in d['residual_ranges'] for x in range(int(r['start']),int(r['end'])+1)}
          assert expected is not None
          arts=[]
          for o in json.load(open('work/current.json')):arts+=o.get('artifacts',[])
          pat=re.compile(r'^p4a-v5r5-gap-ROC([0-9]+)-([LO])-P([0-9]+)-([0-9]+)$')
          sel=[]
          for a in arts:
            m=pat.match(a.get('name',''))
            if not m or a.get('expired') or int(a['id']) in seen:continue
            sel.append((a,int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4))))
          sel.sort(key=lambda t:(t[1],t[2],t[3],t[4],t[0]['id']));assert sel
          covered=set();entries=[]
          for a,y,k,s,e in sel:
            rng={(y,k,x) for x in range(s,e+1)};assert rng<=expected,(a['name'],'outside residual');assert not(covered&rng),(a['name'],'overlap')
            outer=pathlib.Path('work/outer')/f"artifact_{a['id']}.zip"
            subprocess.run(['curl','-fL','--retry','5','--retry-delay','2','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28','-o',str(outer),a['archive_download_url']],check=True)
            ob=outer.read_bytes();osha=hashlib.sha256(ob).hexdigest();dg=a.get('digest') or ''
            if dg.startswith('sha256:'):assert osha==dg.split(':',1)[1]
            dest=pathlib.Path('work/unpack')/str(a['id']);dest.mkdir(parents=True,exist_ok=True)
            with zipfile.ZipFile(outer) as z:z.extractall(dest)
            childs=[p for p in dest.rglob('*.zip') if p.is_file()];assert len(childs)==1
            child=childs[0];cb=child.read_bytes();csha=hashlib.sha256(cb).hexdigest()
            with zipfile.ZipFile(child) as z:
              mans=[n for n in z.namelist() if n=='MANIFEST.json' or n.endswith('/MANIFEST.json')];assert len(mans)==1
              man=json.loads(z.read(mans[0]).decode('utf-8-sig'))
            c=man['coverage'];ass=man['assertions'];caps=man.get('captures',[]);anos=man.get('anomalies',[])
            assert man['schema']=='p4a_material_info_page_chunk_v4';assert (int(c['roc_year']),c['kind'],int(c['start_page']),int(c['end_page']))==(y,k,s,e)
            pc=e-s+1;assert int(ass['page_count'])==pc and int(ass['list_capture_count'])==pc;assert ass['all_http_200'] is True and ass['all_payload_nonempty'] is True
            assert all(x.get('http_status')==200 and int(x.get('payload_bytes',0))>0 for x in caps);assert int(ass['nonstandard_detail_count'])==len(anos);assert all(x.get('disposition')=='PRESERVE_RAW_DO_NOT_ZERO_FILL' for x in anos)
            stored=f"artifact_{a['id']}__{child.name}"
            entries.append({'artifact_id':a['id'],'artifact_name':a['name'],'artifact_outer_sha256':osha,'child_stored_name':stored,'child_original_name':child.name,'child_sha256':csha,'child_size':len(cb),'coverage':{'roc_year':y,'kind':k,'start_page':s,'end_page':e,'page_count':pc},'_child_path':str(child)})
            covered|=rng
          residual=expected-covered
          def comp(keys):
            out=[];by={}
            for y,k,x in sorted(keys):by.setdefault((y,k),[]).append(x)
            for (y,k),xs in by.items():
              st=pr=xs[0]
              for x in xs[1:]:
                if x==pr+1:pr=x
                else:out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1});st=pr=x
              out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1})
            return out
          summary={'schema':'p4a_v5_6_5p_delta_harvest_summary_v1','source_run_id':int(os.environ['RUN5']),'source_requests_made_by_harvest':False,'prior_formal_5p_artifact_count':len(seen),'delta_artifact_count':len(entries),'delta_pages':len(covered),'residual_after_delta_pages':len(residual),'residual_ranges':comp(residual)}
          pathlib.Path('drive_ready/P4A_V5_6_5P_DELTA_HARVEST_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          target=85*1024*1024;groups=[];cur=[];sz=0
          for e in entries:
            cs=int(e['child_size']);assert cs<target
            if cur and sz+cs>target:groups.append(cur);cur=[];sz=0
            cur.append(e);sz+=cs
          if cur:groups.append(cur)
          for i,g in enumerate(groups,1):
            clean=[{k:v for k,v in e.items() if k!='_child_path'} for e in g]
            idx={'schema':'p4a_v5_6_5p_delta_drive_subbundle_index_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_run_id':int(os.environ['RUN5']),'source_requests_made_by_harvest':False,'part':i,'part_count':len(groups),'artifact_count':len(g),'unique_page_count':sum(e['coverage']['page_count'] for e in clean),'entries':clean}
            out=pathlib.Path('drive_ready')/f"P4A-V5.6-5P-DELTA-PART{i:03d}-RUN{os.environ['RUN5']}.zip"
            with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              z.writestr('BUNDLE_INDEX.json',(json.dumps(idx,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode())
              for e in g:z.write(e['_child_path'],e['child_stored_name'])
            assert out.stat().st_size<100*1024*1024
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True));print('drive_ready_parts',len(groups))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-6-5p-delta-drive-ready
          path: drive_ready/*
          if-no-files-found: error
          retention-days: 3
