name: P2-D Q0.17 bounded Wayback CDX probe

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'p2d-q015-byte-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query a bounded set of public CDX targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request, time
          out=pathlib.Path('out')
          targets={
            'tpex_legacy_endpoint_exact':'http://www.gretai.org.tw/ch/stock/aftertrading/broker_trading/download_ALLCSV.php',
            'tpex_2013_example':'http://www.gretai.org.tw/ch/stock/aftertrading/broker_trading/download_ALLCSV.php?curstk=1558&stk_date=1021230',
            'tpex_endpoint_wildcard':'http://www.gretai.org.tw/ch/stock/aftertrading/broker_trading/download_ALLCSV.php?*',
            'forum_aid12002':'http://forum.twbts.com/attachment.php?aid=12002*',
            'tpex_v113_pdf':'https://www.tpex.org.tw/storage/regular_system/新版收市後交易資訊格式說明(V1.13版).pdf',
            'tpex_v112_pdf':'https://www.tpex.org.tw/storage/regular_system/新版收市後交易資訊格式說明(V1.12版).pdf'
          }
          results={}
          for name,target in targets.items():
            q={
              'url':target,
              'output':'json',
              'fl':'timestamp,original,statuscode,mimetype,digest,length',
              'filter':'statuscode:200',
              'collapse':'digest',
              'limit':'50'
            }
            url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(q)
            rec={'target':target,'cdx_url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'P2D-Q017-Wayback-Probe/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                b=r.read(); rec['http_status']=getattr(r,'status',200); rec['content_type']=r.headers.get('Content-Type','')
              rec['bytes']=len(b)
              try:
                data=json.loads(b.decode('utf-8'))
                rec['rows']=data[1:] if isinstance(data,list) and data else []
              except Exception as e:
                rec['parse_error']=repr(e); rec['prefix']=b[:500].decode('utf-8','replace')
            except Exception as e:
              rec['error']=repr(e)
            results[name]=rec
            time.sleep(1)
          (out/'q017_cdx_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q017-wayback-cdx
          path: out/
          if-no-files-found: error
          retention-days: 1
