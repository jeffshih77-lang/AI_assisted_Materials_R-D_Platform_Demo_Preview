name: P2B inspect current XBRL batch page

on:
  push:
    branches: [p2b-financial-transport-20260912]
    paths: [.github/workflows/p2b_xbrl_batch_page_inspect.yml]

permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture and inspect current official batch page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, re, html.parser
          out=pathlib.Path('batch_page'); out.mkdir(exist_ok=True)
          url='https://mopsov.twse.com.tw/mops/web/t203sb02'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=90) as r:
            b=r.read(); headers=dict(r.headers.items()); status=r.status; final=r.geturl()
          (out/'t203sb02.response.bin').write_bytes(b)
          text=None; enc=None
          for e in ('utf-8-sig','utf-8','cp950','big5'):
            try: text=b.decode(e); enc=e; break
            except UnicodeDecodeError: pass
          if text is None: text=b.decode('utf-8','replace'); enc='replace'
          (out/'t203sb02.decoded.html').write_text(text,encoding='utf-8')
          class P(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.nodes=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag in ('form','input','button','a','script'):
                joined=' '.join(f'{k}={v}' for k,v in a.items())
                if any(x.lower() in joined.lower() for x in ['ifrs','zip','file','download','203sb','server-java']) or tag in ('form','input','button'):
                  self.nodes.append({'tag':tag,'attrs':a})
          p=P(); p.feed(text)
          regex={}
          pats={
            'zip_tokens':r'[^\s\"\'<>]{0,120}\.zip[^\s\"\'<>]{0,120}',
            'download_tokens':r'.{0,160}(?:FileDownLoad|download|fileName|filePath|tifrs).{0,240}',
            'onclick_tokens':r'onclick\s*=\s*[\"\']([^\"\']+)[\"\']',
            'form_actions':r'<form\b[^>]*action\s*=\s*[\"\']([^\"\']+)[\"\'][^>]*>',
          }
          for k,pat in pats.items():
            regex[k]=re.findall(pat,text,re.I|re.S)[:500]
          info={'status':status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'headers':headers,'final_url':final,'encoding':enc,'nodes':p.nodes,'regex':regex}
          (out/'inspect.json').write_text(json.dumps(info,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'status':status,'bytes':len(b),'sha256':info['sha256'],'encoding':enc,'node_count':len(p.nodes),'nodes':p.nodes[:150],'regex':regex},ensure_ascii=False))
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2B_XBRL_BATCH_PAGE_INSPECT_20260912
          path: batch_page/
          if-no-files-found: error
          retention-days: 3
