name: T15 Runtime Online Crosscheck
on:
  push:
    branches: [market-downloader-ci-v015]
    paths:
      - 'market_downloader_ci/runtime_online_crosscheck.py'
      - '.github/workflows/t15-runtime-online-crosscheck.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crosscheck saved runtime against official online sources
        env:
          PYTHONUTF8: '1'
        run: python market_downloader_ci/runtime_online_crosscheck.py
