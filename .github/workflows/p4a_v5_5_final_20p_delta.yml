name: P4-A V5.5 final 20p delta harvest
on:
  push:
    paths:
      - '.github/workflows/p4a_v5_5_final_20p_delta.yml'
permissions:
  actions: read
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: '34686421608'
      S1: '10297147729'
      S2: '10296483576'
      S3: '10296334877'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest final late artifact only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/prev work/outer work/unpack drive_ready
          for A in "$S1" "$S2" "$S3"; do
            curl -fL --retry 5 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -o "work/prev/$A.zip" "https://api.github.com/repos/$REPO/actions/artifacts/$A/zip"
            mkdir -p "work/prev/$A"; unzip -q "work/prev/$A.zip" -d "work/prev/$A"
          done
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --paginate --slurp > work/current.json
          python - <<'PY'
          import json,os,re,pathlib,hashlib,zipfile,subprocess
          seen=set(); residual=None
          for root in pathlib.Path('work/prev').iterdir():
            if not root.is_dir(): continue
            for p in root.glob('*.zip'):
              with zipfile.ZipFile(p) as z:
                if 'BUNDLE_INDEX.json' in z.namelist():
                  idx=json.loads(z.read('BUNDLE_INDEX.json'))
                  seen.update(int(e['artifact_id']) for e in idx['entries'])
            for s in root.glob('*SUMMARY*.json'):
              d=json.loads(s.read_text())
              if d.get('residual_after_delta_pages')==3835: residual=d
          assert len(seen)==123,len(seen)
          assert residual is not None
          expected={(int(r['roc']),r['kind'],p) for r in residual['residual_ranges'] for p in range(int(r['start']),int(r['end'])+1)}
          assert len(expected)==3835
          arts=[]
          for o in json.load(open('work/current.json')): arts+=o.get('artifacts',[])
          pat=re.compile(r'^p4a-v5o2-gap-ROC([0-9]+)-([LO])-P([0-9]+)-([0-9]+)$')
          sel=[]
          for a in arts:
            m=pat.match(a.get('name',''))
            if not m or a.get('expired') or int(a['id']) in seen: continue
            sel.append((a,int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4))))
          assert len(sel)==1,[(x[0]['id'],x[0]['name']) for x in sel]
          entries=[]; cov=set()
          for a,y,k,s,e in sel:
            rng={(y,k,p) for p in range(s,e+1)}; assert rng<=expected
            outer=pathlib.Path('work/outer')/f"artifact_{a['id']}.zip"
            subprocess.run(['curl','-fL','--retry','5','--retry-delay','2','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28','-o',str(outer),a['archive_download_url']],check=True)
            ob=outer.read_bytes(); osha=hashlib.sha256(ob).hexdigest(); dg=a.get('digest') or ''
            if dg.startswith('sha256:'): assert osha==dg.split(':',1)[1]
            dest=pathlib.Path('work/unpack')/str(a['id']); dest.mkdir(parents=True,exist_ok=True)
            with zipfile.ZipFile(outer) as z:z.extractall(dest)
            childs=[p for p in dest.rglob('*.zip') if p.is_file()];assert len(childs)==1
            child=childs[0];cb=child.read_bytes();csha=hashlib.sha256(cb).hexdigest()
            with zipfile.ZipFile(child) as z:
              mans=[n for n in z.namelist() if n=='MANIFEST.json' or n.endswith('/MANIFEST.json')];assert len(mans)==1
              man=json.loads(z.read(mans[0]).decode('utf-8-sig'))
            c=man['coverage'];ass=man['assertions'];caps=man.get('captures',[]);anos=man.get('anomalies',[])
            assert man['schema']=='p4a_material_info_page_chunk_v4'
            assert (int(c['roc_year']),c['kind'],int(c['start_page']),int(c['end_page']))==(y,k,s,e)
            pc=e-s+1;assert int(ass['page_count'])==pc and int(ass['list_capture_count'])==pc
            assert ass['all_http_200'] is True and ass['all_payload_nonempty'] is True
            assert all(x.get('http_status')==200 and int(x.get('payload_bytes',0))>0 for x in caps)
            assert int(ass['nonstandard_detail_count'])==len(anos);assert all(x.get('disposition')=='PRESERVE_RAW_DO_NOT_ZERO_FILL' for x in anos)
            stored=f"artifact_{a['id']}__{child.name}"
            entries.append({'artifact_id':a['id'],'artifact_name':a['name'],'artifact_outer_sha256':osha,'child_stored_name':stored,'child_original_name':child.name,'child_sha256':csha,'child_size':len(cb),'coverage':{'roc_year':y,'kind':k,'start_page':s,'end_page':e,'page_count':pc},'_child_path':str(child)})
            cov|=rng
          rem=expected-cov
          def comp(keys):
            out=[];by={}
            for y,k,p in sorted(keys):by.setdefault((y,k),[]).append(p)
            for (y,k),ps in by.items():
              st=pr=ps[0]
              for p in ps[1:]:
                if p==pr+1:pr=p
                else:out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1});st=pr=p
              out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1})
            return out
          summary={'schema':'p4a_v5_5_final_20p_delta_summary_v1','source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_requests_made_by_harvest':False,'delta_successful_artifact_count':1,'delta_successful_pages':len(cov),'residual_after_delta_pages':len(rem),'residual_ranges':comp(rem)}
          pathlib.Path('drive_ready/P4A_V5_5_FINAL_20P_DELTA_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          clean=[{k:v for k,v in e.items() if k!='_child_path'} for e in entries]
          idx={'schema':'p4a_v5_5_final_20p_delta_drive_bundle_index_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_requests_made_by_harvest':False,'artifact_count':1,'unique_page_count':len(cov),'entries':clean}
          out=pathlib.Path('drive_ready/P4A-V5.5-FINAL-20P-DELTA-RUN34686421608.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
            z.writestr('BUNDLE_INDEX.json',(json.dumps(idx,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode())
            for e in entries:z.write(e['_child_path'],e['child_stored_name'])
          assert out.stat().st_size<100*1024*1024
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-5-final-20p-delta-drive-ready
          path: drive_ready/*
          if-no-files-found: error
          retention-days: 3
