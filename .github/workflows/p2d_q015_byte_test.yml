name: P2-D Q0.15 isolated public byte test

on:
  push:
    branches:
      - p2d-q015-byte-test
    paths:
      - .github/workflows/p2d_q015_byte_test.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p2d_q015_byte_test.yml

permissions:
  contents: read

jobs:
  boundary-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and validate two small public candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, io, json, pathlib, urllib.request, zipfile
          out = pathlib.Path('out')
          results = []

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'P2D-Q015-BoundaryTest/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read(), getattr(r, 'status', 200), r.headers.get('Content-Type','')

          url = 'https://raw.githubusercontent.com/tw-lws/StockBrokerPriceCorrelation/f8158354135f74c87013669ce21e75fadf0ae579/data/0050_broker_trading.csv'
          try:
              b, status, ctype = fetch(url)
              git_sha1 = hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
              sha256 = hashlib.sha256(b).hexdigest()
              if len(b) != 1182678 or git_sha1 != 'e94d2ecb4fd6b60458cf58c869accf109c8cbeb4':
                  raise ValueError(f'identity mismatch bytes={len(b)} git_sha1={git_sha1}')
              (out/'tw-lws_0050_broker_trading.csv').write_bytes(b)
              rows = list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
              required = ['securities_trader','price','buy','sell','securities_trader_id','stock_id','date']
              if not rows or list(rows[0].keys()) != required:
                  raise ValueError('schema mismatch')
              dates = sorted({r['date'] for r in rows})
              results.append({'candidate':'tw-lws immutable exact payload','status':'PASS_BYTES_SCHEMA','http_status':status,'content_type':ctype,'bytes':len(b),'git_blob_sha1':git_sha1,'sha256':sha256,'rows':len(rows),'date_min':dates[0],'date_max':dates[-1],'date_count':len(dates),'broker_count':len({r['securities_trader_id'] for r in rows}),'stock_count':len({r['stock_id'] for r in rows}),'price_count':len({r['price'] for r in rows}),'null_required':sum(1 for r in rows for k in required if r[k] in ('',None)),'source_url':url})
          except Exception as e:
              results.append({'candidate':'tw-lws immutable exact payload','status':'FAIL','error':repr(e),'source_url':url})

          url = 'https://eshop.twse.com.tw/uploadFile/sample/BSR_1.ZIP'
          try:
              b, status, ctype = fetch(url)
              sha256 = hashlib.sha256(b).hexdigest()
              (out/'BSR_1.ZIP').write_bytes(b)
              if not zipfile.is_zipfile(io.BytesIO(b)):
                  raise ValueError('response is not ZIP')
              z = zipfile.ZipFile(io.BytesIO(b))
              bad = z.testzip()
              expected = ['證券代號','證券商','成交單價','買進股數','賣出股數']
              schema_hits=[]
              meta=[]
              for info in z.infolist():
                  meta.append({'name':info.filename,'bytes':info.file_size,'compressed_bytes':info.compress_size})
                  if info.is_dir() or info.file_size > 20000000:
                      continue
                  raw=z.read(info.filename)
                  for enc in ('utf-8-sig','cp950','big5'):
                      try: s=raw[:50000].decode(enc)
                      except Exception: continue
                      if all(x in s for x in expected):
                          schema_hits.append({'member':info.filename,'encoding':enc})
                          break
              results.append({'candidate':'TWSE official BSR_1 sample','status':'PASS_BYTES_ZIP','http_status':status,'content_type':ctype,'bytes':len(b),'sha256':sha256,'zip_test':'PASS' if bad is None else f'FAIL:{bad}','members':z.namelist(),'member_meta':meta,'exact_schema_hits':schema_hits,'source_url':url})
          except Exception as e:
              results.append({'candidate':'TWSE official BSR_1 sample','status':'FAIL','error':repr(e),'source_url':url})

          (out/'q015_manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          sha256sum out/* || true

      - name: Upload one-day boundary-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q015-boundary-test
          path: out/
          if-no-files-found: error
          retention-days: 1
