name: P2-D Q0.21 bounded forum7309 page1 attachment probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p2d_q021_forum7309_p1_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect one public source-thread page and disclosed attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, re, html, json, hashlib
          out=pathlib.Path('out'); u='https://forum.twbts.com/viewthread.php?tid=7309&page=1'
          R={'scope':'forum7309_page1_public_only','page_url':u,'attachments_downloaded':0}
          try:
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 P2D-Q021/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read(); R.update(status=getattr(r,'status',200),final_url=r.geturl(),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),content_type=r.headers.get('Content-Type',''))
            (out/'forum7309_p1.html').write_bytes(b)
            s=b.decode('big5hkscs',errors='replace'); ss=html.unescape(s); plain=re.sub(r'<[^>]+>',' ',ss); plain=re.sub(r'\s+',' ',plain)
            t=re.search(r'<title[^>]*>(.*?)</title>',ss,re.I|re.S); R['title']=re.sub('<[^>]+>',' ',t.group(1)).strip() if t else None
            links=[]
            for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',ss,re.I|re.S):
              href=html.unescape(m.group(1)); txt=re.sub('<[^>]+>',' ',m.group(2)); txt=re.sub(r'\s+',' ',html.unescape(txt)).strip()
              if 'attachment.php' in href.lower() or re.search(r'\.(?:rar|zip|csv|xls|xlsx)(?:\?|$)',href.lower()):
                full=urllib.parse.urljoin(u,href); ctx=re.sub(r'<[^>]+>',' ',ss[max(0,m.start()-250):m.end()+300]); ctx=re.sub(r'\s+',' ',html.unescape(ctx)).strip()
                if full not in [x['url'] for x in links]: links.append({'url':full,'anchor_text':txt,'context':ctx[:900]})
            R['attachment_links']=links[:30]
            ctxs={}
            for key in ['交易明細','download=csv','bsContent.aspx','附件','下載','日期隨便打','只有一天','前一日','當日']:
              arr=[]
              for m in re.finditer(re.escape(key),plain,re.I):
                arr.append(plain[max(0,m.start()-450):m.end()+1000]);
                if len(arr)>=8: break
              if arr: ctxs[key]=arr
            R['contexts']=ctxs
          except Exception as e: R['error']=repr(e)
          (out/'q021_manifest.json').write_text(json.dumps(R,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(R,ensure_ascii=False,indent=2))
          PY
      - name: Upload one-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q021-forum7309-p1
          path: out/
          if-no-files-found: error
          retention-days: 1
