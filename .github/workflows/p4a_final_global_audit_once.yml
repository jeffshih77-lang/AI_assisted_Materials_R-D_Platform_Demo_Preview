name: P4-A final exact global audit once
on:
  push:
    paths:
      - '.github/workflows/p4a_final_global_audit_once.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact page-level coverage audit from current P4-A artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate > artifacts-pages.json
          python - <<'PY'
          import json,re,collections
          bounds={81:{'L':0},82:{'L':16},83:{'L':22},84:{'L':27},85:{'L':50,'O':3},86:{'L':82,'O':9},87:{'L':119,'O':19},88:{'L':178,'O':33},89:{'L':224,'O':43},90:{'L':261,'O':71},91:{'L':364,'O':77},92:{'L':307,'O':76},93:{'L':297,'O':101},94:{'L':261,'O':108},95:{'L':213,'O':105},96:{'L':233,'O':117},97:{'L':257,'O':132},98:{'L':246,'O':126},99:{'L':270,'O':142},100:{'L':301,'O':152},101:{'L':274,'O':144},102:{'L':293,'O':159},103:{'L':295,'O':163},104:{'L':307,'O':174},105:{'L':304,'O':177},106:{'L':313,'O':174},107:{'L':327,'O':184},108:{'L':336,'O':190},109:{'L':357,'O':219},110:{'L':409,'O':248},111:{'L':380,'O':233},112:{'L':371,'O':235},113:{'L':424,'O':266},114:{'L':458,'O':286},115:{'L':370,'O':232}}
          raw=json.load(open('artifacts-pages.json'))
          pages=[]
          if isinstance(raw,list):
              for x in raw: pages.extend(x.get('artifacts',[]))
          else: pages=raw.get('artifacts',[])
          cov={(y,k):set() for y,ks in bounds.items() for k in ks}
          hits=collections.Counter(); accepted=[]; unexpected=[]
          # Drive-verified baselines not completely represented by current public-runner artifact history.
          for p in range(4): cov[(85,'O')].add(p); hits[(85,'O',p)]+=1
          for p in range(16): cov[(115,'L')].add(p); hits[(115,'L',p)]+=1
          patterns=[
            re.compile(r'^p4a-material-info-ROC(\d+)-([LO])-P(?:0*)(\d+)-(?:0*)(\d+)-v4$'),
            re.compile(r'^p4a-repair-ROC(\d+)-([LO])-P(\d+)-(\d+)-v4$'),
            re.compile(r'^p4a-auto-repair-ROC(\d+)-([LO])-P(\d+)-(\d+)$'),
            re.compile(r'^p4a-microrepair-ROC(\d+)-([LO])-P(\d+)-(\d+)$'),
            re.compile(r'^p4a-auto-microrepair-ROC(\d+)-([LO])-P(\d+)-(\d+)$'),
            re.compile(r'^p4a-final-ROC(\d+)-([LO])-P(\d+)$'),
            re.compile(r'^p4a-gap-ROC(\d+)-([LO])-P(\d+)-(\d+)$')]
          special='p4a-material-info-ROC115-L-p0014-p0015-public-runner-v4'
          for a in pages:
              if a.get('expired'): continue
              n=a.get('name','')
              if n==special: y,k,s,e=115,'L',14,15
              else:
                  m=None
                  for pat in patterns:
                      m=pat.match(n)
                      if m: break
                  if not m: continue
                  g=m.groups(); y=int(g[0]); k=g[1]; s=int(g[2]); e=int(g[3]) if len(g)>3 else s
              if (y,k) not in cov:
                  unexpected.append({'artifact_id':a.get('id'),'name':n,'reason':'unknown_year_market'}); continue
              maxp=bounds[y][k]
              if s<0 or e<s or e>maxp:
                  unexpected.append({'artifact_id':a.get('id'),'name':n,'reason':'out_of_range','start':s,'end':e,'max_page':maxp}); continue
              accepted.append({'artifact_id':a.get('id'),'name':n,'digest':a.get('digest'),'size_in_bytes':a.get('size_in_bytes'),'roc':y,'kind':k,'start':s,'end':e})
              for p in range(s,e+1): cov[(y,k)].add(p); hits[(y,k,p)]+=1
          required_total=sum(maxp+1 for ks in bounds.values() for maxp in ks.values())
          summaries=[]; missing=[]
          for y,ks in bounds.items():
              for k,maxp in ks.items():
                  req=set(range(maxp+1)); got=cov[(y,k)]
                  miss=sorted(req-got)
                  summaries.append({'roc':y,'kind':k,'max_page':maxp,'required_pages':len(req),'covered_pages':len(got),'missing_pages':len(miss),'missing_ranges':[]})
                  if miss:
                      ranges=[]; st=pr=miss[0]
                      for p in miss[1:]:
                          if p==pr+1: pr=p
                          else: ranges.append([st,pr]); st=pr=p
                      ranges.append([st,pr]); summaries[-1]['missing_ranges']=ranges
                      missing += [{'roc':y,'kind':k,'page':p} for p in miss]
          covered=sum(len(v) for v in cov.values())
          dups=[{'roc':y,'kind':k,'page':p,'evidence_count':c} for (y,k,p),c in sorted(hits.items()) if c>1]
          out={'schema':'p4a_final_exact_global_audit_v2','required_pages':required_total,'covered_pages':covered,'missing_page_count':len(missing),'unexpected_artifact_count':len(unexpected),'duplicate_evidence_page_count':len(dups),'historical_base_complete_artifact_layer':required_total==13410 and covered==required_total and not missing and not unexpected,'summaries':summaries,'missing_pages':missing,'unexpected_artifacts':unexpected,'duplicate_evidence_pages':dups,'accepted_artifacts':accepted}
          open('P4A_FINAL_EXACT_GLOBAL_AUDIT.json','w').write(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ['required_pages','covered_pages','missing_page_count','unexpected_artifact_count','duplicate_evidence_page_count','historical_base_complete_artifact_layer']},indent=2))
          if required_total!=13410 or missing or unexpected: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4a-final-exact-global-audit-${{ github.run_id }}
          path: P4A_FINAL_EXACT_GLOBAL_AUDIT.json
          if-no-files-found: error
          retention-days: 2
