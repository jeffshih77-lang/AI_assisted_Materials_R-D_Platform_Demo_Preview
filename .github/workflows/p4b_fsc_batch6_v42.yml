name: P4-B FSC recovery batch6 v4.2

on:
  push:
    branches: [p4b-runner-probe-20260912]
    paths: [.p4b_triggers/batch6_v42]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Syntax gate
        run: python3 -m py_compile tools/p4b_chunk_capture_v42.py
      - name: Capture C24
        run: python3 tools/p4b_chunk_capture_v42.py C24
      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p4b-fsc-recovery-C24-v42
          path: |
            out/P4B_FSC_RECOVERY_C24_V42.zip
            out/P4B_FSC_RECOVERY_C24_V42_RECEIPT.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
