name: P2D Yvictor remaining 2016 raw backfill

on:
  push:
    branches:
      - p2d-free-broker-qual-20260912
    paths:
      - .github/workflows/p2d_yvictor_remaining_backfill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch byte-exact Yvictor raw members
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p2d_yvictor_remaining
          python3 - <<'PY'
          import csv, hashlib, io, json, pathlib, urllib.request
          repo='Yvictor/brokerBSreport_crawler'
          commit='47ece3474e8110e5e9749d557842673f57d1fc90'
          expected={
            '1101_20160518.csv':('94f4dc3ee55672f0333bd3aec5bb200908b71a89',108152),
            '1102_20160518.csv':('4969276d4aa507e42832e39133457fed6366cd82',64013),
            '1201_20160518.csv':('abc12005b57b6a8b70966592da800bacda0fec12',20321),
            '1210_20160518.csv':('d42225119d573c65e5450915dbc1c78681e11834',63440),
          }
          out=pathlib.Path('p2d_yvictor_remaining')
          manifest=[]
          for name,(want_sha1,want_size) in expected.items():
            url=f'https://raw.githubusercontent.com/{repo}/{commit}/data/stockdt/ori/{name}'
            req=urllib.request.Request(url,headers={'User-Agent':'P2D-PublicRawBackfill/1.0'})
            with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read()
            sha1=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
            sha256=hashlib.sha256(b).hexdigest()
            if len(b)!=want_size or sha1!=want_sha1:
              raise SystemExit(f'identity mismatch {name}: bytes={len(b)} sha1={sha1}')
            text=b.decode('utf-8-sig')
            rows=list(csv.DictReader(io.StringIO(text)))
            reqcols=['日期','代號','證券商','成交單價','買進股數','賣出股數']
            missing=[c for c in reqcols if c not in (rows[0].keys() if rows else [])]
            if missing:
              raise SystemExit(f'missing columns {name}: {missing}')
            brokers=sorted({r['證券商'] for r in rows if r['證券商']})
            stocks=sorted({r['代號'] for r in rows if r['代號']})
            dates=sorted({r['日期'] for r in rows if r['日期']})
            null_core=sum(1 for r in rows for c in reqcols if r.get(c,'')=='')
            (out/name).write_bytes(b)
            manifest.append({
              'file':name,'source_url':url,'bytes':len(b),'git_blob_sha1':sha1,'sha256':sha256,
              'rows':len(rows),'unique_broker_codes':len(brokers),'stock_ids':stocks,'dates':dates,
              'required_core_null_cells':null_core
            })
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload verified raw members
        uses: actions/upload-artifact@v4
        with:
          name: p2d-yvictor-remaining-20160518
          path: p2d_yvictor_remaining/
          if-no-files-found: error
          retention-days: 14
