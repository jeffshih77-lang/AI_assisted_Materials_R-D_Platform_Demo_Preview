name: P4-A V5 post audit 20260912
on:
  workflow_run:
    workflows: ["P4-A V5 residual 10p highthroughput 20260912"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact V5.1 residual audit from successful HT artifacts
        run: |
          set -euo pipefail
          test "$SOURCE_RUN" = "34685616731"
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" --paginate --slurp > artifacts-pages.json
          python - <<'PY'
          import json,os,re,pathlib
          plan=json.load(open('p4a_runner/P4A_EXACT_MISSING_PLAN_V5_20260912.json'))
          v5={(int(r['roc']),r['kind'],p) for r in plan['runs'] for p in range(int(r['start']),int(r['end'])+1)}
          formal77={(96,'O',p) for p in range(50,100)}|{(98,'O',p) for p in range(75,100)}|{(98,'O',p) for p in range(125,127)}
          required=v5-formal77
          assert len(v5)==8425 and len(formal77)==77 and len(required)==8348
          arts=[]
          for o in json.load(open('artifacts-pages.json')):arts+=o.get('artifacts',[])
          rx=re.compile(r'^p4a-v5r-gap-ROC(\d+)-([LO])-P(\d+)-(\d+)$')
          covered=set();accepted=[];unexpected=[];duplicates=[]
          for a in arts:
            if a.get('expired'):continue
            m=rx.match(a.get('name',''))
            if not m:continue
            y=int(m.group(1));k=m.group(2);s=int(m.group(3));e=int(m.group(4));pages={(y,k,p) for p in range(s,e+1)}
            bad=pages-required
            if bad:unexpected.append({'artifact_id':a['id'],'name':a['name'],'unexpected_page_count':len(bad)});continue
            ov=covered&pages
            if ov:duplicates.append({'artifact_id':a['id'],'name':a['name'],'duplicate_page_count':len(ov)});continue
            covered|=pages
            accepted.append({'artifact_id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'page_count':e-s+1})
          missing=sorted(required-covered)
          def ranges(keys):
            out=[];by={}
            for y,k,p in keys:by.setdefault((y,k),[]).append(p)
            for (y,k),ps in sorted(by.items()):
              ps=sorted(ps);s=pr=ps[0]
              for p in ps[1:]:
                if p==pr+1:pr=p
                else:out.append({'roc':y,'kind':k,'start':s,'end':pr,'page_count':pr-s+1});s=pr=p
              out.append({'roc':y,'kind':k,'start':s,'end':pr,'page_count':pr-s+1})
            return out
          result={'schema':'p4a_v5_1_ht_result_audit_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_run_id':int(os.environ['SOURCE_RUN']),'formal_baseline_covered_pages':5062,'repair_required_pages':8348,'accepted_success_artifact_count':len(accepted),'candidate_repair_covered_pages':len(covered),'candidate_total_covered_pages':5062+len(covered),'residual_missing_pages':len(missing),'unexpected_out_of_plan_artifact_count':len(unexpected),'duplicate_evidence_artifact_count':len(duplicates),'accepted_artifacts':accepted,'residual_missing_ranges':ranges(missing) if missing else [],'unexpected':unexpected,'duplicates':duplicates,'note':'artifact-layer only; formal coverage requires Drive raw-byte readback before credit','formal_v5_1_audit_drive_id':'1SsnnZXNlNc5z73saIL4U0Sgx6SeU9p_a'}
          pathlib.Path('P4A_V5_1_HT_RESULT_AUDIT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:result[k] for k in ['accepted_success_artifact_count','candidate_repair_covered_pages','candidate_total_covered_pages','residual_missing_pages','unexpected_out_of_plan_artifact_count','duplicate_evidence_artifact_count']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-1-ht-result-audit-source${{ github.event.workflow_run.id }}
          path: P4A_V5_1_HT_RESULT_AUDIT.json
          if-no-files-found: error
          retention-days: 3
