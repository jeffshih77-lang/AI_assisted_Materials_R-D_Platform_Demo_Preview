name: P2-D Q0.16 forum attachment probe

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'p2d-q015-byte-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test exact public aid12002 RAR href once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          out=pathlib.Path('out')
          page='https://forum.twbts.com/thread-7341-1-1.html'
          url='https://forum.twbts.com/attachment.php?aid=MTIwMDJ8NDFiNzcxMjV8MTc4OTI0MzgzOHw0MWJjRnc4dXRaK044ZTQzU092cVZFN1lvcHpla3NSN1AweXJ1NUpvdkllN2Z4VQ%3D%3D'
          result={'scope':'one_exact_public_attachment_href_probe','source_page':page,'visible_attachment_name':'交易明細.rar','visible_attachment_id':'aid12002','visible_size':'189.27 KB','url':url}
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 P2D-Q016-PublicArchiveProbe/1.2','Referer':page})
            with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read(); status=getattr(r,'status',200); ct=r.headers.get('Content-Type',''); final=r.geturl(); cd=r.headers.get('Content-Disposition','')
            archive=b.startswith(b'Rar!')
            result.update({'status':status,'final_url':final,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':ct,'content_disposition':cd,'magic_hex':b[:32].hex(),'rar_magic':archive})
            if status==200 and archive:
              (out/'transaction_detail_20120803_aid12002.rar').write_bytes(b)
            else:
              # Preserve only a tiny diagnostic prefix; do not attempt auth/cookie/CAPTCHA or alternate IDs.
              (out/'response_prefix.bin').write_bytes(b[:4096])
          except Exception as e:
            result['error']=repr(e)
          (out/'q016_exact_attachment_manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload one-day probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q016-exact-rar-probe
          path: out/
          if-no-files-found: error
          retention-days: 1
