name: W08 PRE residual contract probe v1
on:
  push:
    branches: [w08-final-free-source-20260912]
    paths: ['.github/workflows/w08_pre_residual_contract_probe_v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w08-final-free-source-20260912
      - name: Probe official PRE residual contracts
        run: python3 w08_public_runner/w08_pre_residual_contract_probe_v1.py
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: W08_PRE_RESIDUAL_CONTRACT_PROBE_V1_20260912
          path: out_pre_residual_probe/
          if-no-files-found: error
          retention-days: 7
