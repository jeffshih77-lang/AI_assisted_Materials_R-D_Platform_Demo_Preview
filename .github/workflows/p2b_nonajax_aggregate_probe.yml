name: P2B nonajax aggregate probe
on:
  push:
    branches: [p2b-financial-transport-20260912]
    paths: [.github/workflows/p2b_nonajax_aggregate_probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe MOPSOV non-AJAX market-quarter reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, pathlib, hashlib, json, re, time
          out=pathlib.Path('probe'); out.mkdir(exist_ok=True)
          reports={'PL':('t163sb04',['公司代號','基本每股盈餘']),'BS':('t163sb05',['公司代號','資產']),'CF':('t163sb20',['公司代號','現金流量']),'OPR':('t163sb06',['公司代號'])}
          samples=[('sii',102,1),('otc',102,1),('sii',108,2),('otc',108,2),('sii',115,2),('otc',115,2),('sii',115,3),('otc',115,3)]
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          rows=[]
          def dec(b):
            for e in ('utf-8-sig','utf-8','cp950','big5'):
              try:return b.decode(e),e
              except UnicodeDecodeError: pass
            return b.decode('utf-8','replace'),'replace'
          def req(url,data=None):
            h={'User-Agent':ua,'Accept':'text/html,*/*','Referer':'https://mopsov.twse.com.tw/mops/web/'}
            if data is not None:h['Content-Type']='application/x-www-form-urlencoded'
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h),timeout=90); return r.status,r.read(),r.geturl(),None
            except urllib.error.HTTPError as e:return e.code,e.read(),url,repr(e)
            except Exception as e:return None,b'',url,repr(e)
          for typ,y,q in samples:
            for rk,(ep,marks) in reports.items():
              form={'encodeURIComponent':'1','step':'1','firstin':'1','off':'1','TYPEK':typ,'year':str(y),'season':f'{q:02d}'}
              for mode in ('POST','GET'):
                base=f'https://mopsov.twse.com.tw/mops/web/{ep}'
                if mode=='POST': st,b,final,err=req(base,urllib.parse.urlencode(form).encode())
                else: st,b,final,err=req(base+'?'+urllib.parse.urlencode(form))
                tx,enc=dec(b); flat=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',tx))
                blocked=('FOR SECURITY REASONS' in tx or '因為安全性考量' in tx)
                nodata=any(x in re.sub(r'\s+','',tx) for x in ['查無資料','無符合條件之資料','無資料'])
                valid=st==200 and len(b)>2000 and all(m in tx for m in marks) and not blocked and not nodata
                tag=f'{typ}_{y}Q{q}_{rk}_{mode}'; (out/(tag+'.bin')).write_bytes(b)
                row={'market':typ,'year':y,'quarter':q,'report':rk,'endpoint':ep,'mode':mode,'status':st,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest() if b else None,'encoding':enc,'valid':valid,'blocked':blocked,'no_data':nodata,'head_text':flat[:400],'final_url':final,'error':err}
                rows.append(row); print(json.dumps(row,ensure_ascii=False)); time.sleep(.08)
          (out/'probe.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P2B_NONAJAX_AGGREGATE_PROBE_20260912
          path: probe/
          if-no-files-found: error
          retention-days: 3
