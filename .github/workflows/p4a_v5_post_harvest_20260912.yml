name: P4-A V5 post harvest 20260912
on:
  workflow_run:
    workflows: ["P4-A exact missing V5 20260912"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      successful_artifacts: ${{ steps.plan.outputs.successful_artifacts }}
      covered_pages: ${{ steps.plan.outputs.covered_pages }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" --paginate --slurp > pages.json
          python - <<'PY'
          import json, os, re
          objs=json.load(open('pages.json'))
          arts=[]
          for o in objs: arts.extend(o.get('artifacts',[]))
          pat=re.compile(r'^p4a-v5-gap-ROC(\d+)-([LO])-P(\d+)-(\d+)$')
          rows=[]; pages=0
          for a in arts:
            m=pat.match(a.get('name',''))
            if not m or a.get('expired'): continue
            y=int(m.group(1)); k=m.group(2); s=int(m.group(3)); e=int(m.group(4))
            rows.append({'id':int(a['id']),'size':int(a['size_in_bytes']),'roc':y,'kind':k,'start':s,'end':e})
            pages += e-s+1
          rows.sort(key=lambda x:(x['roc'],x['kind'],x['start'],x['end'],x['id']))
          # Conservative batching by GitHub artifact archive size. Inner payload is already ZIP,
          # so archive size is a close upper-bound proxy. Keep well below Drive's 100 MiB transfer ceiling.
          limit=55_000_000; batches=[]; cur=[]; sz=0
          for r in rows:
            if cur and sz+r['size']>limit:
              batches.append(cur); cur=[]; sz=0
            cur.append(r); sz += r['size']
          if cur: batches.append(cur)
          inc=[{'batch':f'{i+1:03d}','ids':','.join(str(x['id']) for x in b)} for i,b in enumerate(batches)]
          matrix=json.dumps({'include':inc},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+matrix+'\n')
            f.write('successful_artifacts='+str(len(rows))+'\n')
            f.write('covered_pages='+str(pages)+'\n')
          print('source_run',os.environ['SOURCE_RUN'],'successful_artifacts',len(rows),'pages',pages,'batches',len(batches))
          PY

  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.successful_artifacts != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BATCH: ${{ matrix.batch }}
      IDS_CSV: ${{ matrix.ids }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Download successful V5 artifacts only
        run: |
          set -euo pipefail
          mkdir -p incoming stage
          IFS=',' read -ra IDS <<< "$IDS_CSV"
          for id in "${IDS[@]}"; do
            gh api "repos/$REPO/actions/artifacts/$id" > "incoming/$id.meta.json"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "incoming/$id.outer.zip"
          done
      - name: Validate every V4 RAW fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,re,zipfile,io,hashlib,pathlib
          inc=pathlib.Path('incoming'); stage=pathlib.Path('stage')
          pat=re.compile(r'^p4a-v5-gap-ROC(\d+)-([LO])-P(\d+)-(\d+)$')
          ids=[int(x) for x in os.environ['IDS_CSV'].split(',') if x]; index=[]
          for aid in ids:
            meta=json.load(open(inc/f'{aid}.meta.json')); outer=(inc/f'{aid}.outer.zip').read_bytes()
            exp=meta.get('digest','').split(':',1)[-1]; got=hashlib.sha256(outer).hexdigest()
            if not exp or got!=exp: raise SystemExit(f'outer digest mismatch {aid}')
            m=pat.match(meta['name'])
            if not m: raise SystemExit(f'unrecognized V5 artifact {aid} {meta["name"]}')
            y=int(m.group(1)); k=m.group(2); s=int(m.group(3)); e=int(m.group(4))
            with zipfile.ZipFile(io.BytesIO(outer)) as oz:
              children=[n for n in oz.namelist() if n.lower().endswith('.zip') and not n.endswith('/')]
              if len(children)!=1: raise SystemExit(f'{aid}: expected one inner zip')
              child_name=children[0]; child=oz.read(child_name)
            with zipfile.ZipFile(io.BytesIO(child)) as cz:
              mans=[n for n in cz.namelist() if n.endswith('/MANIFEST.json') or n=='MANIFEST.json']
              if len(mans)!=1: raise SystemExit(f'{aid}: manifest count {len(mans)}')
              man=json.loads(cz.read(mans[0]).decode('utf-8-sig'))
            if man.get('schema')!='p4a_material_info_page_chunk_v4': raise SystemExit(f'{aid}: wrong schema')
            cov=man['coverage']; ass=man['assertions']; caps=man.get('captures',[]); anos=man.get('anomalies',[])
            if (int(cov['roc_year']),cov['kind'],int(cov['start_page']),int(cov['end_page']))!=(y,k,s,e): raise SystemExit(f'{aid}: coverage mismatch')
            pc=e-s+1
            listcaps=[x for x in caps if x.get('stage')=='LIST']; details=[x for x in caps if x.get('stage')=='DETAIL']
            if int(ass['page_count'])!=pc or int(ass['list_capture_count'])!=pc or len(listcaps)!=pc: raise SystemExit(f'{aid}: page/list mismatch')
            if int(ass['detail_capture_count'])!=len(details): raise SystemExit(f'{aid}: detail mismatch')
            if ass.get('all_http_200') is not True or ass.get('all_payload_nonempty') is not True: raise SystemExit(f'{aid}: assertions fail')
            if any(x.get('http_status')!=200 or int(x.get('payload_bytes',0))<=0 for x in caps): raise SystemExit(f'{aid}: bad capture')
            if int(ass['nonstandard_detail_count'])!=len(anos): raise SystemExit(f'{aid}: anomaly mismatch')
            if any(a.get('disposition')!='PRESERVE_RAW_DO_NOT_ZERO_FILL' for a in anos): raise SystemExit(f'{aid}: anomaly disposition')
            pages=sorted(int(x['page']) for x in man.get('page_summaries',[]))
            if pages!=list(range(s,e+1)): raise SystemExit(f'{aid}: page summaries mismatch')
            stored=f'artifact_{aid}__{pathlib.Path(child_name).name}'
            (stage/stored).write_bytes(child)
            index.append({'artifact_id':aid,'artifact_name':meta['name'],'artifact_outer_digest':meta['digest'],'artifact_outer_size':meta['size_in_bytes'],'child_original_name':child_name,'child_stored_name':stored,'child_sha256':hashlib.sha256(child).hexdigest(),'child_size':len(child),'coverage':{'roc_year':y,'kind':k,'start_page':s,'end_page':e,'page_count':pc},'assertions':{'list_capture_count':len(listcaps),'detail_capture_count':len(details),'nonstandard_detail_count':len(anos),'all_http_200':True,'all_payload_nonempty':True}})
          out={'schema':'p4a_v5_post_harvest_bundle_index_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_run_id':int(os.environ['SOURCE_RUN']),'source_requests_made_by_harvest':False,'batch':os.environ['BATCH'],'artifact_count':len(index),'entries':index}
          (stage/'BUNDLE_INDEX.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('validated artifacts',len(index),'pages',sum(x['coverage']['page_count'] for x in index))
          PY
      - name: Build and self-verify Drive-ready parent
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,zipfile,pathlib,hashlib
          st=pathlib.Path('stage'); idx=json.loads((st/'BUNDLE_INDEX.json').read_text())
          out=pathlib.Path(f'P4A-V5-HARVEST-BATCH{os.environ["BATCH"]}-SOURCE{os.environ["SOURCE_RUN"]}.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
            z.write(st/'BUNDLE_INDEX.json','BUNDLE_INDEX.json')
            for e in idx['entries']: z.write(st/e['child_stored_name'],e['child_stored_name'])
          if out.stat().st_size >= 100*1024*1024: raise SystemExit(f'Drive-ready parent too large: {out.stat().st_size}')
          with zipfile.ZipFile(out) as z:
            check=json.loads(z.read('BUNDLE_INDEX.json'))
            for e in check['entries']:
              b=z.read(e['child_stored_name'])
              assert len(b)==e['child_size'] and hashlib.sha256(b).hexdigest()==e['child_sha256']
          print(out, out.stat().st_size, hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-harvest-batch${{ matrix.batch }}-source${{ github.event.workflow_run.id }}
          path: P4A-V5-HARVEST-BATCH${{ matrix.batch }}-SOURCE${{ github.event.workflow_run.id }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
