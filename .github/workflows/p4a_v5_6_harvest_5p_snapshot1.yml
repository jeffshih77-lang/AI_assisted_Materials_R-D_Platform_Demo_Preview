name: P4-A V5.6 harvest 5p snapshot1
on:
  push:
    paths:
      - '.github/workflows/p4a_v5_6_harvest_5p_snapshot1.yml'
permissions:
  actions: read
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PRE_RUN: '34685616731'
      RUN20: '34686421608'
      RUN5: '34691917746'
    steps:
      - uses: actions/checkout@v4
      - name: Harvest current successful 5p artifacts without source requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/outer work/unpack drive_ready
          for R in "$PRE_RUN" "$RUN20" "$RUN5"; do
            gh api "repos/$REPO/actions/runs/$R/artifacts?per_page=100" --paginate --slurp > "work/arts-$R.json"
          done
          python - <<'PY'
          import json,os,re,pathlib,hashlib,zipfile,subprocess
          p=json.load(open('p4a_runner/P4A_EXACT_MISSING_PLAN_V5_20260912.json'))
          v5={(int(r['roc']),r['kind'],x) for r in p['runs'] for x in range(int(r['start']),int(r['end'])+1)}
          formal77={(96,'O',x) for x in range(50,100)} | {(98,'O',x) for x in range(75,100)} | {(98,'O',x) for x in range(125,127)}
          req=v5-formal77; assert len(req)==8348
          pats={os.environ['PRE_RUN']:re.compile(r'^p4a-v5r-gap-ROC([0-9]+)-([LO])-P([0-9]+)-([0-9]+)$'),os.environ['RUN20']:re.compile(r'^p4a-v5o2-gap-ROC([0-9]+)-([LO])-P([0-9]+)-([0-9]+)$')}
          prior=set()
          for R,pat in pats.items():
            arts=[]
            for o in json.load(open(f'work/arts-{R}.json')):arts+=o.get('artifacts',[])
            for a in arts:
              if a.get('expired'):continue
              m=pat.match(a.get('name',''))
              if not m:continue
              y,k,s,e=int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4));q={(y,k,x) for x in range(s,e+1)}
              assert q<=req;prior|=q
          expected=req-prior;assert len(expected)==3815,len(expected)
          arts=[]
          for o in json.load(open(f"work/arts-{os.environ['RUN5']}.json")):arts+=o.get('artifacts',[])
          pat=re.compile(r'^p4a-v5r5-gap-ROC([0-9]+)-([LO])-P([0-9]+)-([0-9]+)$')
          selected=[]
          for a in arts:
            m=pat.match(a.get('name',''))
            if not m or a.get('expired'):continue
            selected.append((a,int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4))))
          selected.sort(key=lambda t:(t[1],t[2],t[3],t[4],t[0]['id']));assert selected
          entries=[];covered=set()
          for a,y,k,s,e in selected:
            rng={(y,k,x) for x in range(s,e+1)};assert rng<=expected,(a['name'],'outside residual');assert not(covered&rng),(a['name'],'overlap')
            outer=pathlib.Path('work/outer')/f"artifact_{a['id']}.zip"
            subprocess.run(['curl','-fL','--retry','5','--retry-delay','2','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28','-o',str(outer),a['archive_download_url']],check=True)
            ob=outer.read_bytes();osha=hashlib.sha256(ob).hexdigest();dg=a.get('digest') or ''
            if dg.startswith('sha256:'):assert osha==dg.split(':',1)[1]
            dest=pathlib.Path('work/unpack')/str(a['id']);dest.mkdir(parents=True,exist_ok=True)
            with zipfile.ZipFile(outer) as z:z.extractall(dest)
            childs=[p for p in dest.rglob('*.zip') if p.is_file()];assert len(childs)==1
            child=childs[0];cb=child.read_bytes();csha=hashlib.sha256(cb).hexdigest()
            with zipfile.ZipFile(child) as z:
              mans=[n for n in z.namelist() if n=='MANIFEST.json' or n.endswith('/MANIFEST.json')];assert len(mans)==1
              man=json.loads(z.read(mans[0]).decode('utf-8-sig'))
            c=man['coverage'];ass=man['assertions'];caps=man.get('captures',[]);anos=man.get('anomalies',[])
            assert man['schema']=='p4a_material_info_page_chunk_v4'
            assert (int(c['roc_year']),c['kind'],int(c['start_page']),int(c['end_page']))==(y,k,s,e)
            pc=e-s+1;assert int(ass['page_count'])==pc and int(ass['list_capture_count'])==pc
            assert ass['all_http_200'] is True and ass['all_payload_nonempty'] is True
            assert all(x.get('http_status')==200 and int(x.get('payload_bytes',0))>0 for x in caps)
            assert int(ass['nonstandard_detail_count'])==len(anos);assert all(x.get('disposition')=='PRESERVE_RAW_DO_NOT_ZERO_FILL' for x in anos)
            stored=f"artifact_{a['id']}__{child.name}"
            entries.append({'artifact_id':a['id'],'artifact_name':a['name'],'artifact_outer_sha256':osha,'child_stored_name':stored,'child_original_name':child.name,'child_sha256':csha,'child_size':len(cb),'coverage':{'roc_year':y,'kind':k,'start_page':s,'end_page':e,'page_count':pc},'_child_path':str(child)})
            covered|=rng
          residual=expected-covered
          def comp(keys):
            out=[];by={}
            for y,k,x in sorted(keys):by.setdefault((y,k),[]).append(x)
            for (y,k),xs in by.items():
              st=pr=xs[0]
              for x in xs[1:]:
                if x==pr+1:pr=x
                else:out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1});st=pr=x
              out.append({'roc':y,'kind':k,'start':st,'end':pr,'page_count':pr-st+1})
            return out
          summary={'schema':'p4a_v5_6_5p_snapshot1_harvest_summary_v1','source_run_id':int(os.environ['RUN5']),'source_requests_made_by_harvest':False,'expected_residual_pages':3815,'successful_artifact_count':len(entries),'successful_pages':len(covered),'residual_after_snapshot_pages':len(residual),'residual_ranges':comp(residual)}
          pathlib.Path('drive_ready/P4A_V5_6_5P_SNAPSHOT1_HARVEST_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          target=85*1024*1024;groups=[];cur=[];sz=0
          for e in entries:
            cs=int(e['child_size']);assert cs<target
            if cur and sz+cs>target:groups.append(cur);cur=[];sz=0
            cur.append(e);sz+=cs
          if cur:groups.append(cur)
          for i,g in enumerate(groups,1):
            clean=[{k:v for k,v in e.items() if k!='_child_path'} for e in g]
            idx={'schema':'p4a_v5_6_5p_snapshot1_drive_subbundle_index_v1','lane_code':'P4-A','dataset':'MATERIAL_INFO','source_run_id':int(os.environ['RUN5']),'source_requests_made_by_harvest':False,'part':i,'part_count':len(groups),'artifact_count':len(g),'unique_page_count':sum(e['coverage']['page_count'] for e in clean),'entries':clean}
            out=pathlib.Path('drive_ready')/f"P4A-V5.6-5P-SNAPSHOT1-PART{i:03d}-RUN{os.environ['RUN5']}.zip"
            with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED) as z:
              z.writestr('BUNDLE_INDEX.json',(json.dumps(idx,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode())
              for e in g:z.write(e['_child_path'],e['child_stored_name'])
            assert out.stat().st_size<100*1024*1024
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True));print('drive_ready_parts',len(groups))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-v5-6-5p-snapshot1-drive-ready
          path: drive_ready/*
          if-no-files-found: error
          retention-days: 3
