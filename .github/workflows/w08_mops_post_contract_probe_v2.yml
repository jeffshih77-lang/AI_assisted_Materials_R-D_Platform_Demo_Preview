name: W08 MOPS POST contract probe v2 session-aware

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w08_mops_post_contract_probe_v2.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run session-aware exact POST qualification probes
        run: python3 w08_public_runner/w08_mops_post_contract_probe_v2.py
      - name: Summarize probes
        if: always()
        run: |
          ls -lh w08_post_probe_v2_out || true
          [ -f w08_post_probe_v2_out/PROBE_MANIFEST.json ] && sha256sum w08_post_probe_v2_out/PROBE_MANIFEST.json || true
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08-mops-post-contract-probe-v2
          path: w08_post_probe_v2_out/
          if-no-files-found: error
          retention-days: 7
