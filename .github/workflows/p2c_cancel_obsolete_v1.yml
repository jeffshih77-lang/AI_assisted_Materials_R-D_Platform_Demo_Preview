name: P2-C cancel obsolete valuation v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p2c_cancel_obsolete_v1.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete annual valuation run 34687002181
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/34687002181/cancel")
          echo "HTTP=$code"
          cat response.json || true
          test "$code" = "202" -o "$code" = "409"
