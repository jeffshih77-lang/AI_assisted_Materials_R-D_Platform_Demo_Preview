name: TWSE RAW W01 History Free
on:
  push:
    branches: [twse-raw-free-20260910]
    paths:
      - 'twse_raw_free/work_units_full.csv.gz.b64'
      - '.github/workflows/twse_raw_history_free.yml'
permissions:
  contents: read
concurrency:
  group: twse-raw-w01-history-free
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - name: Restore frozen scope
        run: base64 -d twse_raw_free/work_units_full.csv.gz.b64 | gzip -dc > twse_raw_free/work_units_full.csv
      - name: Download and validate official RAW shard
        run: |
          python twse_raw_free/collector.py \
            --work-units twse_raw_free/work_units_full.csv \
            --output-root "out_${{ matrix.year }}" \
            --year "${{ matrix.year }}" --package \
            --attempts 5 --retry-wait 8 --min-delay 0.8 --max-delay 1.4
      - name: Upload yearly package
        uses: actions/upload-artifact@v4
        with:
          name: TWSE_DAILY_K_${{ matrix.year }}_OFFICIAL_RAW
          path: |
            out_${{ matrix.year }}/packages/*.zip
            out_${{ matrix.year }}/manifest/*.json
            out_${{ matrix.year }}/manifest/*.jsonl
          compression-level: 9
          retention-days: 1
          if-no-files-found: error
