name: W08 universe deterministic diagnose v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w08_universe_diagnose_v2.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 w08_public_runner/w08_universe_diagnose_v2.py
