name: P2-C valuation formal RAW v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p2c_valuation_formal_raw_v1.yml

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact entity-body bytes by date
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, pathlib, hashlib, json, datetime, time, os, sys
          year=int(os.environ['YEAR'])
          out=pathlib.Path(f'out_p2c_valuation_{year}')
          raw_twse=out/'raw'/'TWSE_BWIBBU'; raw_tpex=out/'raw'/'TPEX_PERATIO'
          raw_twse.mkdir(parents=True,exist_ok=True); raw_tpex.mkdir(parents=True,exist_ok=True)
          manifest=[]; anomalies=[]
          UA='Mozilla/5.0 P2-C-FormalRAW/1.0'
          ctx_tpex=ssl._create_unverified_context()
          start=datetime.date(year,1,1); end=datetime.date(year,12,31)
          global_end=datetime.date(2026,9,11)
          if end>global_end: end=global_end

          def classify_twse(body, req_date):
            rec={'kind':'UNPARSED','rows':None,'internal_date':None,'fields':None,'stat':None}
            try:
              j=json.loads(body.decode('utf-8-sig'))
              rec['stat']=j.get('stat') if isinstance(j,dict) else None
              rec['internal_date']=j.get('date') if isinstance(j,dict) else None
              rec['fields']=j.get('fields') if isinstance(j,dict) else None
              d=j.get('data') if isinstance(j,dict) else None
              rec['rows']=len(d) if isinstance(d,list) else 0
              if rec['stat']=='OK' and rec['rows']>0: rec['kind']='DATA'
              elif rec['rows']==0: rec['kind']='NO_DATA'
              else: rec['kind']='OTHER'
            except Exception as e: rec['parse_error']=f'{type(e).__name__}:{e}'
            return rec

          def classify_tpex(body, req_date):
            rec={'kind':'UNPARSED','rows':None,'internal_date':None,'fields':None,'stat':None}
            try:
              j=json.loads(body.decode('utf-8-sig'))
              rec['stat']=j.get('stat') if isinstance(j,dict) else None
              rec['internal_date']=j.get('date') if isinstance(j,dict) else None
              tables=j.get('tables') if isinstance(j,dict) else None
              if isinstance(tables,list) and tables:
                t=tables[0]; rec['fields']=t.get('fields'); rec['rows']=t.get('totalCount')
                if rec['rows'] is None and isinstance(t.get('data'),list): rec['rows']=len(t['data'])
              else: rec['rows']=0
              if rec['stat']=='ok' and isinstance(rec['rows'],int) and rec['rows']>0: rec['kind']='DATA'
              elif rec['stat']=='ok' and rec['rows']==0: rec['kind']='NO_DATA'
              else: rec['kind']='OTHER'
            except Exception as e: rec['parse_error']=f'{type(e).__name__}:{e}'
            return rec

          def fetch(url, ctx=None):
            last=None
            for attempt in range(1,4):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*','Accept-Encoding':'identity','Connection':'close'})
              try:
                with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                  return r.status,r.geturl(),dict(r.headers.items()),r.read(),attempt,None
              except urllib.error.HTTPError as e:
                return e.code,e.geturl(),dict(e.headers.items()) if e.headers else {},e.read(),attempt,f'HTTPError:{e.code}'
              except Exception as e:
                last=f'{type(e).__name__}:{e}'
                time.sleep(0.5*attempt)
            return None,url,{},b'',3,last

          d=start
          while d<=end:
            ymd=d.strftime('%Y%m%d')
            # TWSE public history starts 2005-09-02; no fabricated requests before source boundary.
            if d>=datetime.date(2005,9,2):
              url=f'https://www.twse.com.tw/exchangeReport/BWIBBU_d?response=json&date={ymd}&selectType=ALL'
              status,final,h,b,attempt,err=fetch(url)
              p=raw_twse/f'{ymd}.json'; p.write_bytes(b)
              cls=classify_twse(b,d)
              m={'source':'TWSE_BWIBBU','date':ymd,'url':url,'final_url':final,'status':status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'attempt':attempt,'error':err,'tls_verified':True,**cls}
              manifest.append(m)
              if status!=200 or err or cls['kind'] not in ('DATA','NO_DATA'): anomalies.append(m)
            # TPEx current historical endpoint is formally qualified from 2007-01-02; TLS chain exception is explicit.
            if d>=datetime.date(2007,1,2):
              roc=d.year-1911
              ds=f'{roc:03d}/{d.month:02d}/{d.day:02d}'
              url=f'https://www.tpex.org.tw/web/stock/aftertrading/peratio_analysis/pera_result.php?l=zh-tw&o=json&d={ds}&c='
              status,final,h,b,attempt,err=fetch(url,ctx_tpex)
              p=raw_tpex/f'{ymd}.json'; p.write_bytes(b)
              cls=classify_tpex(b,d)
              m={'source':'TPEX_PERATIO','date':ymd,'url':url,'final_url':final,'status':status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'attempt':attempt,'error':err,'tls_verified':False,'tls_exception':'SERVER_CHAIN_NOT_VERIFIABLE_ON_GHA_UBUNTU_20260912_QUALIFIED_WITH_RECORDED_UNVERIFIED_CONTEXT',**cls}
              manifest.append(m)
              if status!=200 or err or cls['kind'] not in ('DATA','NO_DATA'): anomalies.append(m)
            d += datetime.timedelta(days=1)

          (out/'MANIFEST.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False,sort_keys=True)+'\n' for x in manifest))
          summary={
            'year':year,'request_records':len(manifest),
            'twse':{'records':sum(x['source']=='TWSE_BWIBBU' for x in manifest),'data':sum(x['source']=='TWSE_BWIBBU' and x['kind']=='DATA' for x in manifest),'no_data':sum(x['source']=='TWSE_BWIBBU' and x['kind']=='NO_DATA' for x in manifest)},
            'tpex':{'records':sum(x['source']=='TPEX_PERATIO' for x in manifest),'data':sum(x['source']=='TPEX_PERATIO' and x['kind']=='DATA' for x in manifest),'no_data':sum(x['source']=='TPEX_PERATIO' and x['kind']=='NO_DATA' for x in manifest)},
            'anomaly_count':len(anomalies),
            'unique_field_signatures':{},
          }
          for src in ['TWSE_BWIBBU','TPEX_PERATIO']:
            sig={}
            for x in manifest:
              if x['source']!=src: continue
              key=json.dumps(x.get('fields'),ensure_ascii=False,separators=(',',':'))
              sig[key]=sig.get(key,0)+1
            summary['unique_field_signatures'][src]=sig
          (out/'SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (out/'ANOMALIES.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False,sort_keys=True)+'\n' for x in anomalies))
          sha_lines=[]
          for p in sorted((out/'raw').rglob('*.json')):
            sha_lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\n")
          (out/'SHA256SUMS.txt').write_text(''.join(sha_lines))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if anomalies:
            print('ANOMALIES',len(anomalies),file=sys.stderr)
            sys.exit(2)
          PY
      - name: Upload formal RAW year
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2c-valuation-formal-raw-${{ matrix.year }}-v1
          path: out_p2c_valuation_${{ matrix.year }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
