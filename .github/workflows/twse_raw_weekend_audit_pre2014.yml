name: TWSE RAW W01 Weekend Audit 2007-2013
on:
  push:
    branches: [twse-raw-weekend-audit-pre2014-final]
    paths:
      - '.github/workflows/twse_raw_weekend_audit_pre2014.yml'
permissions:
  contents: read
jobs:
  weekend_audit:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2007, 2008, 2009, 2010, 2011, 2012, 2013]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Scan every weekend date against TWSE official source
        id: audit
        continue-on-error: true
        run: python twse_raw_v4/weekend_audit.py --year "${{ matrix.year }}" --out "audit_${{ matrix.year }}"
      - name: Upload weekend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWSE_DAILY_K_${{ matrix.year }}_WEEKEND_AUDIT_V1
          path: audit_${{ matrix.year }}/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Propagate audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
