name: tmp-free-institutional-candidate-probe-20260912
on:
  push:
    branches: [tmp-free-public-data-probe-20260912]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe free FinMind institutional candidate codes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw
          python - <<'PY'
          import requests, json, hashlib, os, time
          BASE='https://api.finmindtrade.com/api/v4/data'
          start='2018-06-05'; end='2023-09-15'
          futures=['TX','TXF','TE','EXF','TF','FXF','MTX','ZEF','ZFF','TMF','GTF','G2F','E4F','BTF','SOF','SHF','M1F','XIF','TJF','UDF','SPF','UNF','SXF','F1F','STF','SF','ETF']
          options=['TXO','TEO','TFO','STO','STC','ETC']
          summary=[]
          s=requests.Session(); s.headers.update({'User-Agent':'public-data-validation/1.0'})
          for dataset,codes in [('TaiwanFuturesInstitutionalInvestors',futures),('TaiwanOptionInstitutionalInvestors',options)]:
              for code in codes:
                  rec={'dataset':dataset,'data_id':code,'start_date':start,'end_date':end}
                  try:
                      r=s.get(BASE,params={'dataset':dataset,'data_id':code,'start_date':start,'end_date':end},timeout=60)
                      b=r.content; rec.update(http_status=r.status_code,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),content_type=r.headers.get('content-type'))
                      j=r.json(); rows=j.get('data',[]) if isinstance(j,dict) else []
                      rec['api_status']=j.get('status') if isinstance(j,dict) else None; rec['msg']=j.get('msg') if isinstance(j,dict) else None; rec['rows']=len(rows)
                      if rows:
                          dates=sorted({x.get('date') for x in rows if x.get('date')})
                          names=sorted({str(x.get('name')) for x in rows if x.get('name') is not None})
                          inst=sorted({str(x.get('institutional_investors')) for x in rows if x.get('institutional_investors') is not None})
                          rec['date_min']=dates[0] if dates else None; rec['date_max']=dates[-1] if dates else None; rec['date_count']=len(dates); rec['names']=names[:20]; rec['institutional_investors']=inst; rec['columns']=sorted(rows[0].keys())
                          open(f'out/raw/{dataset}__{code}.json','wb').write(b)
                  except Exception as e:
                      rec['error']=repr(e)
                  summary.append(rec)
                  print(json.dumps(rec,ensure_ascii=False))
                  time.sleep(0.15)
          open('out/summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-free-institutional-candidate-probe-20260912
          path: out/
          retention-days: 1
