name: P4-A auto repair full-matrix failures
on:
  workflow_run:
    workflows: ['TEMP P4-A public runner full matrix v4']
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --paginate > jobs.json
          python - <<'PY'
          import json, os, re
          docs=[]
          raw=json.load(open('jobs.json'))
          if isinstance(raw,list):
              for x in raw: docs.extend(x.get('jobs',[]))
          else: docs=raw.get('jobs',[])
          exclude={(84,'L'),(85,'L'),(86,'L'),(88,'O'),(89,'O'),(90,'L'),(91,'L')}
          pat=re.compile(r'^capture \((\d+), ([LO]), (\d+), (\d+)\)$')
          inc=[]
          seen=set()
          for j in docs:
              if j.get('conclusion')!='failure': continue
              m=pat.match(j.get('name',''))
              if not m: continue
              roc=int(m.group(1)); kind=m.group(2); start=int(m.group(3)); end=int(m.group(4))
              if (roc,kind) in exclude: continue
              for a in range(start,end+1,50):
                  b=min(a+49,end); key=(roc,kind,a,b)
                  if key not in seen:
                      seen.add(key); inc.append({'roc':roc,'kind':kind,'start':a,'end':b})
          inc.sort(key=lambda x:(x['roc'],x['kind'],x['start']))
          matrix=json.dumps({'include':inc},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+matrix+'\n'); f.write('count='+str(len(inc))+'\n')
          print('planned chunks',len(inc)); print(matrix)
          PY
  repair:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROC_YEAR: ${{ matrix.roc }}
      KIND: ${{ matrix.kind }}
      START_PAGE: ${{ matrix.start }}
      END_PAGE: ${{ matrix.end }}
      DETAIL_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Capture formal RAW with extended retries
        run: |
          cp p4a_runner/p4a_material_info_page_chunk_v4.py /tmp/p4a_collector.py
          sed -i 's/def get(url, retries=3):/def get(url, retries=10):/' /tmp/p4a_collector.py
          python /tmp/p4a_collector.py
      - name: Package artifact
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root=next(pathlib.Path('out_p4a_chunk').iterdir())
          out=pathlib.Path(root.name+'.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-auto-repair-ROC${{ matrix.roc }}-${{ matrix.kind }}-P${{ matrix.start }}-${{ matrix.end }}
          path: P4A-MATERIAL-ROC${{ matrix.roc }}-${{ matrix.kind }}-P*.zip
          if-no-files-found: error
          retention-days: 2
  bundle:
    needs: [plan,repair]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: repair_artifacts
      - name: Bundle successful repair artifacts
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          root=pathlib.Path('repair_artifacts'); files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); files.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          idx={'schema':'p4a_auto_repair_bundle_v1','source_run_id':${{ github.event.workflow_run.id }},'repair_run_id':${{ github.run_id }},'file_count':len(files),'files':files}
          (root/'BUNDLE_INDEX.json').write_text(json.dumps(idx,indent=2,sort_keys=True)+'\n')
          out=pathlib.Path('P4A-AUTO-REPAIR-RUN-${{ github.run_id }}-BUNDLE.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          print(out, hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p4a-auto-repair-run-${{ github.run_id }}-bundle
          path: P4A-AUTO-REPAIR-RUN-${{ github.run_id }}-BUNDLE.zip
          retention-days: 2
