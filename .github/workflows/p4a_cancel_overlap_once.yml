name: P4-A cancel overlapping repair runs once
on:
  push:
    paths:
      - '.github/workflows/p4a_cancel_overlap_once.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded low-throughput V5 repair run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run in 34684185077; do
            echo "cancel $run"
            gh api --method POST "repos/$REPO/actions/runs/$run/cancel" || true
          done
