name: P2-D Q0.18 immutable old tw-lws blob gate

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: read

jobs:
  byte-gate:
    if: github.head_ref == 'p2d-q015-byte-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and validate one immutable historical CSV blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import csv, hashlib, io, json, pathlib, urllib.request
          out=pathlib.Path('out')
          commit='200949911c2032f0f6b4fff87cccfee355194ae4'
          expected_blob='2c08fb54dc2b85ad79621a6bb0a7913b16f8ce8f'
          url=f'https://raw.githubusercontent.com/tw-lws/StockBrokerPriceCorrelation/{commit}/data/0050_broker_trading.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'P2D-Q018-ImmutableBlobGate/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              b=r.read(); status=getattr(r,'status',200); ctype=r.headers.get('Content-Type','')
          gitsha=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          sha256=hashlib.sha256(b).hexdigest()
          if gitsha != expected_blob:
              raise SystemExit(f'GIT_BLOB_MISMATCH got={gitsha} expected={expected_blob}')
          rows=list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
          required=['securities_trader','price','buy','sell','securities_trader_id','stock_id','date']
          if not rows or list(rows[0].keys()) != required:
              raise SystemExit(f'SCHEMA_MISMATCH {list(rows[0].keys()) if rows else None}')
          dates=sorted({r['date'] for r in rows})
          info={
              'status':'PASS_BYTES_SCHEMA_GIT_IDENTITY',
              'source_commit':commit,
              'source_git_blob_sha1':gitsha,
              'bytes':len(b),
              'sha256':sha256,
              'rows':len(rows),
              'date_min':dates[0],
              'date_max':dates[-1],
              'date_count':len(dates),
              'dates':dates,
              'stock_ids':sorted({r['stock_id'] for r in rows}),
              'broker_count':len({r['securities_trader_id'] for r in rows}),
              'price_count':len({r['price'] for r in rows}),
              'required_nulls':sum(1 for r in rows for k in required if r[k] in ('',None)),
              'branch_9217_rows':sum(1 for r in rows if r['securities_trader_id']=='9217'),
              'http_status':status,
              'content_type':ctype,
              'source_url':url
          }
          (out/'P2D_RAW_SECONDARY_TWLWS_0050_OLD_20231121_20231201.csv').write_bytes(b)
          (out/'q018_manifest.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
          sha256sum out/*
      - name: Upload one-day byte-gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2d-q018-old-twlws-blob
          path: out/
          if-no-files-found: error
          retention-days: 1
