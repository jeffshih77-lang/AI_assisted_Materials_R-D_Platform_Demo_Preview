name: P2B formal financial historical RAW v1

on:
  push:
    branches: [p2b-financial-transport-20260912]
    paths: [.github/workflows/p2b_financial_formal_raw_v1.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Capture, qualify, validate and package P2-B formal RAW
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import html.parser
          import json
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          OUT=pathlib.Path('out')
          RAW=OUT/'raw'; META=OUT/'metadata'; CTRL=OUT/'control'
          for p in (RAW,META,CTRL): p.mkdir(parents=True,exist_ok=True)

          HOST='mopsov.twse.com.tw'
          BASE=f'https://{HOST}/mops/web/{{endpoint}}'
          MARKETS={'TWSE':'sii','TPEX':'otc'}
          REPORTS={
            'PL': {'endpoint':'t163sb04','markers_any':['基本每股盈餘','每股盈餘']},
            'BS': {'endpoint':'t163sb05','markers_any':['資產總額','資產']},
            'CF': {'endpoint':'t163sb20','markers_any':['現金流量','營業活動之淨現金流','營業活動之現金流量']},
            'OPR':{'endpoint':'t163sb06','markers_any':['營業利益率','毛利率','稅後純益率']},
          }
          START=(102,1); END=(115,2); NEXT=(115,3)
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36 P2BFormalRaw/1.0'

          def sha(b): return hashlib.sha256(b).hexdigest()
          def utcnow(): return dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          def quarters(a,b):
            y,q=a
            while (y,q)<=b:
              yield y,q
              q += 1
              if q==5: y+=1; q=1
          def decode(b):
            for enc in ('utf-8-sig','utf-8','cp950','big5'):
              try: return b.decode(enc),enc
              except UnicodeDecodeError: pass
            return b.decode('utf-8','replace'),'utf-8-replace'
          def no_data(text):
            s=re.sub(r'\s+','',text)
            return any(x in s for x in ('查無資料','無符合條件之資料','沒有資料','無資料'))
          def blocked(text):
            low=text.lower()
            return ('for security reasons' in low or '因為安全性考量' in text or 'access denied' in low or '驗證碼' in text or 'captcha' in low)

          class TableCellParser(html.parser.HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=True)
              self.table_depth=0; self.tables=[]; self.current=None
              self.in_cell=False; self.cell=[]
            def handle_starttag(self,tag,attrs):
              t=tag.lower()
              if t=='table':
                if self.table_depth==0: self.current=[]
                self.table_depth += 1
              elif t in ('td','th') and self.table_depth>0:
                self.in_cell=True; self.cell=[]
            def handle_data(self,data):
              if self.in_cell and self.table_depth>0: self.cell.append(data)
            def handle_endtag(self,tag):
              t=tag.lower()
              if t in ('td','th') and self.in_cell:
                val=re.sub(r'\s+',' ',' '.join(self.cell)).strip()
                if self.current is not None: self.current.append(val)
                self.in_cell=False; self.cell=[]
              elif t=='table' and self.table_depth>0:
                self.table_depth -= 1
                if self.table_depth==0 and self.current is not None:
                  self.tables.append(self.current); self.current=None

          def semantic_signature(report,text):
            parser=TableCellParser()
            try: parser.feed(text)
            except Exception: pass
            marks=REPORTS[report]['markers_any']
            chosen=[]
            for cells in parser.tables:
              joined=' '.join(cells)
              if '公司代號' in joined and any(m in joined for m in marks):
                chosen.append(cells)
            if not chosen:
              return {'target_tables':0,'target_cells':0,'semantic_sha256':None,'code_cells':0,'code_set_sha256':None}
            flat=[]; codes=[]
            for cells in chosen:
              flat.extend(cells)
              for c in cells:
                c0=c.strip()
                if re.fullmatch(r'[0-9A-Za-z]{4,6}',c0) and any(ch.isdigit() for ch in c0):
                  codes.append(c0)
            canonical='\x1f'.join(re.sub(r'\s+',' ',x).strip() for x in flat)
            code_sorted=sorted(set(codes))
            return {
              'target_tables':len(chosen),
              'target_cells':len(flat),
              'semantic_sha256':hashlib.sha256(canonical.encode('utf-8')).hexdigest(),
              'code_cells':len(code_sorted),
              'code_set_sha256':hashlib.sha256('\n'.join(code_sorted).encode('utf-8')).hexdigest() if code_sorted else None,
            }

          def classify(report,body,status):
            text,enc=decode(body)
            nd=no_data(text); blk=blocked(text)
            sig=semantic_signature(report,text)
            valid=(status==200 and len(body)>2000 and not nd and not blk and sig['target_tables']>0 and sig['semantic_sha256'] is not None)
            if valid: kind='DATA'
            elif nd: kind='NO_DATA'
            elif blk: kind='SECURITY_BLOCK'
            elif status in (404,410): kind='NO_DATA_HTTP'
            elif status==200: kind='INVALID_OR_TEMPLATE'
            elif status is None: kind='TRANSPORT_ERROR'
            else: kind='HTTP_ERROR'
            return valid,kind,enc,sig

          def do_request(url,form,mode,timeout=35):
            data=None
            req_url=url
            headers={
              'User-Agent':UA,
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Referer':url,
            }
            if mode=='POST':
              data=urllib.parse.urlencode(form).encode('ascii')
              headers['Content-Type']='application/x-www-form-urlencoded'
            else:
              req_url=url+'?'+urllib.parse.urlencode(form)
            at=utcnow()
            try:
              req=urllib.request.Request(req_url,data=data,method=mode,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                body=r.read()
                return {'transport_ok':True,'status':getattr(r,'status',200),'body':body,'headers':dict(r.headers.items()),'final_url':r.geturl(),'retrieved_at':at,'mode':mode,'request_url':req_url,'error':None}
            except urllib.error.HTTPError as e:
              body=e.read() if hasattr(e,'read') else b''
              return {'transport_ok':True,'status':e.code,'body':body,'headers':dict(e.headers.items()) if e.headers else {},'final_url':req_url,'retrieved_at':at,'mode':mode,'request_url':req_url,'error':repr(e)}
            except Exception as e:
              return {'transport_ok':False,'status':None,'body':b'','headers':{},'final_url':req_url,'retrieved_at':at,'mode':mode,'request_url':req_url,'error':repr(e)}

          def fetch(report,market,roc,q,require_data=True):
            endpoint=REPORTS[report]['endpoint']
            url=BASE.format(endpoint=endpoint)
            form={'encodeURIComponent':'1','step':'1','firstin':'1','off':'1','TYPEK':MARKETS[market],'year':str(roc),'season':f'{q:02d}'}
            attempts=[]
            # POST is the source page's native form behavior. GET is a byte-preserving fallback observed to return the same requested report semantically.
            for mode in ('POST','GET'):
              for attempt in range(1,3):
                r=do_request(url,form,mode)
                valid,kind,enc,sig=classify(report,r['body'],r['status'])
                attempts.append({'mode':mode,'attempt':attempt,'transport_ok':r['transport_ok'],'status':r['status'],'bytes':len(r['body']),'sha256':sha(r['body']) if r['body'] else None,'classification':kind,'semantic_signature':sig,'error':r['error']})
                if require_data and valid:
                  r.update({'valid':True,'classification':kind,'encoding':enc,'semantic_signature':sig,'form':form,'attempts':attempts})
                  return r
                if not require_data and kind=='NO_DATA':
                  r.update({'valid':False,'classification':kind,'encoding':enc,'semantic_signature':sig,'form':form,'attempts':attempts})
                  return r
                if not require_data and valid:
                  r.update({'valid':True,'classification':kind,'encoding':enc,'semantic_signature':sig,'form':form,'attempts':attempts})
                  return r
                time.sleep(0.7*attempt)
            # Return last attempt for fail-closed diagnostics.
            r.update({'valid':False,'classification':kind,'encoding':enc,'semantic_signature':sig,'form':form,'attempts':attempts})
            return r

          # Qualification: IFRS boundary, mid-era, recent, latest complete, and explicit next-quarter no-data.
          QUAL_SAMPLES=[(102,1),(108,2),(114,4),(115,2)]
          qualification=[]; repeatability=[]; boundary=[]
          for market in MARKETS:
            for report in REPORTS:
              for roc,q in QUAL_SAMPLES:
                r=fetch(report,market,roc,q,True)
                row={'market':market,'report':report,'roc_year':roc,'quarter':q,'transport_ok':r['transport_ok'],'http_status':r['status'],'bytes':len(r['body']),'payload_sha256':sha(r['body']) if r['body'] else None,'encoding':r['encoding'],'valid':r['valid'],'classification':r['classification'],'semantic_signature':r['semantic_signature'],'request_mode':r['mode'],'request_url':r['request_url'],'request_form':r['form'],'retrieved_at':r['retrieved_at'],'attempts':r['attempts']}
                qualification.append(row)
                if not r['valid']:
                  raise SystemExit('QUALIFICATION_FAIL '+json.dumps(row,ensure_ascii=False))
                time.sleep(.08)
              # Semantic repeatability at latest complete period. Exact wrapper bytes may differ because MOPS page chrome is dynamic.
              a=fetch(report,market,115,2,True); time.sleep(.35); b=fetch(report,market,115,2,True)
              rep={'market':market,'report':report,'period':'ROC115Q2','first_payload_sha256':sha(a['body']),'second_payload_sha256':sha(b['body']),'byte_identical':a['body']==b['body'],'first_semantic_sha256':a['semantic_signature']['semantic_sha256'],'second_semantic_sha256':b['semantic_signature']['semantic_sha256'],'semantic_identical':a['semantic_signature']['semantic_sha256']==b['semantic_signature']['semantic_sha256'],'first_code_set_sha256':a['semantic_signature']['code_set_sha256'],'second_code_set_sha256':b['semantic_signature']['code_set_sha256'],'code_set_identical':a['semantic_signature']['code_set_sha256']==b['semantic_signature']['code_set_sha256']}
              repeatability.append(rep)
              if not rep['semantic_identical'] or not rep['code_set_identical']:
                raise SystemExit('SEMANTIC_REPEATABILITY_FAIL '+json.dumps(rep,ensure_ascii=False))
              n=fetch(report,market,NEXT[0],NEXT[1],False)
              brow={'market':market,'report':report,'roc_year':NEXT[0],'quarter':NEXT[1],'classification':n['classification'],'http_status':n['status'],'bytes':len(n['body']),'sha256':sha(n['body']) if n['body'] else None,'request_mode':n['mode'],'attempts':n['attempts']}
              boundary.append(brow)
              if n['classification']!='NO_DATA':
                raise SystemExit('LATEST_BOUNDARY_FAIL '+json.dumps(brow,ensure_ascii=False))

          captures=[]; ledger=[]; anomalies=[]
          total_payload_bytes=0
          for market in MARKETS:
            for roc,q in quarters(START,END):
              members=[]; wu_ok=True
              for report in REPORTS:
                r=fetch(report,market,roc,q,True)
                base={'market':market,'report':report,'roc_year':roc,'quarter':q,'http_status':r['status'],'bytes':len(r['body']),'payload_sha256':sha(r['body']) if r['body'] else None,'encoding':r['encoding'],'classification':r['classification'],'semantic_signature':r['semantic_signature'],'request_mode':r['mode'],'request_url':r['request_url'],'request_form':r['form'],'retrieved_at':r['retrieved_at'],'attempts':r['attempts']}
                if not r['valid']:
                  anomalies.append(base); wu_ok=False; continue
                rd=RAW/market/f'ROC{roc:03d}Q{q}'; md=META/market/f'ROC{roc:03d}Q{q}'
                rd.mkdir(parents=True,exist_ok=True); md.mkdir(parents=True,exist_ok=True)
                rp=rd/f'{report}.response.bin'; mp=md/f'{report}.capture.json'
                rp.write_bytes(r['body'])
                meta={
                  'schema':'p2b_exact_http_capture_v1',
                  'dataset':'FINANCIAL_STATEMENTS_EPS',
                  'work_unit_id':f'P2B-{market}-ROC{roc:03d}Q{q}',
                  'market':market,'roc_year':roc,'quarter':q,'report':report,
                  'source_family':'MOPSOV_IFRS_MARKET_QUARTER_AGGREGATE',
                  'schema_family':'MOPS_IFRS_AGGREGATE_HTML_V1',
                  'official_host':HOST,'method':r['mode'],'request_url':r['request_url'],'request_form':r['form'],'final_url':r['final_url'],
                  'retrieved_at':r['retrieved_at'],'published_at':'unknown','available_at':'unknown',
                  'period_semantics':'source-preserved report-period/cumulative semantics; no single-quarter derivation performed in RAW',
                  'restatement_semantics':'current official historical aggregate view at retrieval; original filing-version chronology is not exposed by this aggregate endpoint',
                  'http_status':r['status'],'response_headers':r['headers'],'payload_bytes':len(r['body']),'payload_sha256':sha(r['body']),'encoding_detected':r['encoding'],
                  'semantic_signature':r['semantic_signature'],'raw_semantics':'exact HTTP response body bytes','classification':'FORMAL_RAW_CANDIDATE_PENDING_DRIVE_READBACK',
                  'transport_attempts':r['attempts'],
                }
                mp.write_text(json.dumps(meta,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
                member={'report':report,'payload_bytes':len(r['body']),'payload_sha256':sha(r['body']),'semantic_sha256':r['semantic_signature']['semantic_sha256'],'raw_path':str(rp.relative_to(OUT)),'metadata_path':str(mp.relative_to(OUT)),'request_mode':r['mode']}
                members.append(member); captures.append(base|{'raw_path':member['raw_path'],'metadata_path':member['metadata_path']}); total_payload_bytes += len(r['body'])
                time.sleep(.08)
              status='RAW_CAPTURED_PENDING_CLOUD_VERIFY' if wu_ok and len(members)==len(REPORTS) else 'INCOMPLETE_ANOMALY'
              ledger.append({'work_unit_id':f'P2B-{market}-ROC{roc:03d}Q{q}','market':market,'roc_year':roc,'quarter':q,'status':status,'members':members})

          incomplete=[x for x in ledger if x['status']!='RAW_CAPTURED_PENDING_CLOUD_VERIFY']
          if incomplete:
            raise SystemExit('COVERAGE_GAP '+json.dumps(incomplete[:20],ensure_ascii=False))
          expected_wus=2*len(list(quarters(START,END)))
          if len(ledger)!=108 or expected_wus!=108 or len(captures)!=432:
            raise SystemExit(f'COUNT_MISMATCH wus={len(ledger)} expected={expected_wus} payloads={len(captures)}')

          contract={
            'schema':'p2b_source_contract_v1','version':'P2-B-SOURCE-CONTRACT-v1','dataset':'FINANCIAL_STATEMENTS_EPS','status':'FROZEN',
            'source_family':'MOPSOV_IFRS_MARKET_QUARTER_AGGREGATE','schema_family':'MOPS_IFRS_AGGREGATE_HTML_V1','official_host':HOST,
            'reports':{k:{'endpoint':v['endpoint'],'semantic_role':{'PL':'comprehensive_income_and_eps','BS':'balance_sheet','CF':'cash_flow','OPR':'operating_financial_ratios'}[k]} for k,v in REPORTS.items()},
            'market_mapping':MARKETS,'work_unit':'market x quarter/reporting-period','formal_coverage':{'start':'ROC102-Q1','end':'ROC115-Q2','work_units':108,'raw_payloads':432},
            'latest_complete_period_qualified':'ROC115-Q2 / 2026Q2','next_period_boundary':'ROC115-Q3 official NO_DATA on all markets/reports at qualification time',
            'historical_source_boundary':'v1 begins at IFRS aggregate regime ROC102-Q1; pre-IFRS history is a separate schema/source regime and is not silently merged into v1',
            'restatement_and_pit_boundary':'aggregate pages expose current historical values at retrieval, not original filing-version chronology; published_at and available_at remain unknown in RAW metadata',
            'period_value_semantics':'income statement/EPS values retain the source report-period/cumulative semantics; no downstream single-quarter differencing is performed in RAW',
            'raw_preservation':'exact HTTP response body bytes + request form/query + response metadata + payload SHA-256',
            'repeatability_rule':'exact wrapper bytes may vary because MOPS page chrome is dynamic; qualification requires identical normalized target-table semantic fingerprint and company-code set across re-fetches',
            'transport':'POST preferred with retry; GET query fallback on transient failure; every accepted payload must pass semantic validation',
            'encoding':'detected per payload; RAW bytes never transcoded','immutable_raw':True,
          }
          qdoc={'schema':'p2b_source_qualification_v1','status':'PASS_WITH_SOURCE_BOUNDARY','contract_version':'P2-B-SOURCE-CONTRACT-v1','samples':qualification,'repeatability':repeatability,'latest_boundary':boundary,'legacy_supplement':'117-row nine-stock research supplement retained as lineage only; not promoted to formal RAW'}
          coverage={'schema':'p2b_coverage_v1','dataset':'FINANCIAL_STATEMENTS_EPS','markets':{'TWSE':{'first':'ROC102-Q1','last':'ROC115-Q2','work_units':54,'internal_gaps':0},'TPEX':{'first':'ROC102-Q1','last':'ROC115-Q2','work_units':54,'internal_gaps':0}},'total_work_units':108,'raw_payloads':432,'latest_complete_gregorian':'2026Q2','source_boundaries':['PRE_IFRS_SEPARATE_SCHEMA_REGIME_NOT_INCLUDED_V1','AGGREGATE_SOURCE_DOES_NOT_PRESERVE_ORIGINAL_FILING_VERSION_OR_POINT_IN_TIME_AVAILABLE_AT'],'open_unclassified_true_gaps':0,'status':'HISTORICAL_BASE_CAPTURED_WITH_SOURCE_BOUNDARY_PENDING_CLOUD_VERIFY'}
          manifest={'schema':'p2b_manifest_v1','dataset':'FINANCIAL_STATEMENTS_EPS','claimant_id':'P2-B-CHAT-20260912-1732','source_contract_version':'P2-B-SOURCE-CONTRACT-v1','generated_at':utcnow(),'coverage':coverage,'work_units':len(ledger),'raw_payload_files':len(captures),'payload_bytes':total_payload_bytes,'members':ledger,'formal_state':'HISTORICAL_BASE_CAPTURED_WITH_SOURCE_BOUNDARY_PENDING_CLOUD_VERIFY'}
          anomaly={'schema':'p2b_anomaly_ledger_v1','capture_anomalies':anomalies,'qualified_boundary_no_data':boundary,'transient_transport_events':[{'work_unit_id':x['work_unit_id'],'report':m['report'],'request_mode':m['request_mode']} for x in ledger for m in x['members'] if m['request_mode']=='GET'],'unclassified_true_gaps':[],'source_boundaries':coverage['source_boundaries']}
          controls={
            'P2B_SOURCE_CONTRACT.json':contract,
            'P2B_SOURCE_QUALIFICATION.json':qdoc,
            'P2B_WORK_UNIT_LEDGER.json':{'schema':'p2b_work_unit_ledger_v1','work_units':ledger},
            'P2B_COVERAGE.json':coverage,
            'P2B_ANOMALY_LEDGER.json':anomaly,
            'P2B_MANIFEST.json':manifest,
          }
          for name,obj in controls.items():
            (CTRL/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          package=OUT/'P2B_FINANCIAL_STATEMENTS_EPS_FORMAL_RAW_20260912.zip'
          files=sorted(p for root in (RAW,META,CTRL) for p in root.rglob('*') if p.is_file())
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files: z.write(p,p.relative_to(OUT).as_posix())
          with zipfile.ZipFile(package,'r') as z:
            bad=z.testzip()
            if bad: raise SystemExit('ZIP_INTEGRITY_FAIL '+bad)
          psha=sha(package.read_bytes())
          info={'schema':'p2b_package_info_v1','file_name':package.name,'bytes':package.stat().st_size,'sha256':psha,'member_count':len(files),'raw_payload_files':len(captures),'metadata_files':len(captures),'control_files':len(controls),'work_units':len(ledger),'payload_bytes':total_payload_bytes,'zip_integrity':'PASS','formal_status':'PENDING_DRIVE_UPLOAD_AND_READBACK'}
          (OUT/'P2B_PACKAGE_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(f'{psha}  {package.name}\n',encoding='utf-8')
          print(json.dumps({'qualification':'PASS_WITH_SOURCE_BOUNDARY','coverage':coverage,'work_units':len(ledger),'raw_payload_files':len(captures),'payload_bytes':total_payload_bytes,'package_bytes':package.stat().st_size,'package_sha256':psha,'zip_integrity':'PASS'},ensure_ascii=False))
          PY

      - name: Upload P2-B formal RAW artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2B_FINANCIAL_STATEMENTS_EPS_FORMAL_RAW_20260912
          path: |
            out/P2B_FINANCIAL_STATEMENTS_EPS_FORMAL_RAW_20260912.zip
            out/P2B_PACKAGE_INFO.json
            out/SHA256SUMS.txt
            out/control/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
